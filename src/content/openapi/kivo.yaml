openapi: 3.1.0
info:
  title: Kivo API
  version: 1.0.0
  summary: The Kivo media server's public API.
  description: |
    The contract between the Kivo server and every client: the web app, the
    Android TV app and third-party tools. It is long-lived; changes are
    additive.

    ## Conventions

    1. **Paths.** Everything is under `/api/v1`, except `/healthz`. Segments are
       lowercase plural nouns, kebab-case when multiword (`/play-events`).
       An ID in a path is `{id}`, or `{artworkId}` and similar when nested.
       Actions on a resource are `POST /{resource}/{id}/{action}`, and
       actions on a whole collection `POST /{collection}/{action}`
       (`/downloads/check`, `/device-codes/poll`); no other path holds a
       verb. A play's media lives under `/api/v1/plays/{id}/`.
    2. **Methods and status codes.** `GET` reads. `POST` creates (`201` with
       the resource) or runs an action (`200` with its result, `202` with
       `Accepted` when it starts background work, `204` when there is
       nothing to return). `PATCH` edits with merge semantics, so only fields
       present change, and returns the updated resource, except a play's
       heartbeat, which returns `204`. `DELETE` returns `204`. There is no
       `PUT`.
    3. **JSON.** Field names are camelCase. Every resource has `id`;
       references are `<thing>Id` (`libraryId`, `workId`). Kind fields
       (`kind`, `type`, `state` and the like) are open strings with documented
       values, never closed enums: clients skip values they don't know.
       Kind-specific data is nested under the kind's name
       (`episode: {seasonNumber, number, airDate}`). Absent optional fields
       are omitted, never null. Documented string values are camelCase
       (`directPlay`, `inProgress`), except task names, which are the
       server's own, and quality names (`4k`, `1080p`), which are names,
       not words.
    4. **Units.** Times are RFC 3339 UTC strings named `…At`. Durations and
       positions are integer milliseconds named `…Ms`, on the version's
       timeline for playback. Bitrates are bits per second named `…Bps`.
       Sizes are bytes named `…Bytes`.
    5. **Lists.** A list is the envelope `{items}` of one item type, and
       a paged list's page size is `limit`. A grid's schema is named
       `…Page`, a feed's `…Feed` and a whole list's `…List`
       (`WorkSummaryPage`, `WorkSummaryFeed`, `WorkSummaryList`). Each kind of list has one
       paging style. A grid (a library's works, collections, authors and
       book series, and Favorites) is paged by position: `offset` items
       from the start, with `total` on every page. A feed (the Unmatched
       and Missing files lists, activity, history, play events and the
       logs) is read in order: `next` is an opaque keyset cursor, passed back as `after`,
       and `total`, where a feed has one, is set on its first page only.
       A list that isn't paged comes back whole, with neither: an item's
       children and files, a collection's root works, Search, Home, and the
       short lists the server holds whole (libraries, users, sessions,
       plays, problems, folders, artwork choices and matches). Filters are plain
       query parameters, repeated for several values, a range as its
       `From` and `To`.
    6. **Errors.** Every non-2xx response is `application/problem+json`
       (RFC 9457) with a stable `code` and the `requestId`. Clients translate
       codes; `detail` is for logs. Something the caller may not see is `404`,
       the same as something that doesn't exist. A request body over 1 MB
       (26 MB for an artwork upload) is `413` with `invalidRequest`.
    7. **Naming.** operationIds are verbNoun camelCase. Paths name the
       resource listed (`/libraries/{id}/authors`), and each operation does
       one job. An acronym is a word in a name (`ApiKey`, `HdrFormat`, `ExternalId`). A thing is
       called by one word everywhere: a movie, show, episode, video or
       book is a work, and a count of them is `workCount`. One schema per concept: `WorkSummary` is a work's summary
       everywhere (a library's works, children, search, Home), `WorkDetail`
       its detail page; a collection, an author and a book series have
       summaries of their own.
    8. **Access.** Every operation states its access level in
       `x-kivo-access`; nothing is implicit:
       - `public`: no credentials.
       - `signedIn`: a signed-in session or an API key.
       - `viewer`: a signed-in session or an API key; reads are filtered by
         its user's Viewer.
       - `admin`: a viewer whose user is an admin.
       - `cast`: a viewer, or a cast token. A cast token reaches these
         routes only, as an ordinary user even when its user is an admin;
         on any other route it is `403` with code `forbidden`.
       - `play`: the play's ID in the path is the credential. These routes
         take no cookie or token, answer cross-origin `GET` and `HEAD`
         and their preflights without credentials (Google Cast), and check
         the play's owner's current permissions on every request.

       Two more extensions state an operation's policy:
       - `x-kivo-receiver: true`: the Cast receiver calls it, so it answers
         the receiver's origin across origins, preflights included, without
         credentials. Every `cast` operation is one too.
       - `x-kivo-upload: true`: its body is a file, which may be up to 26 MB
         and take 10 minutes to send.

    ## Client identity

    Every request a Kivo app makes says what is asking, a header per field:

    - `Kivo-App`: the app, such as `kivo-android`, `kivo-apple`, `kivo-web` or `kivo-tizen`.
    - `Kivo-App-Version`: its version.
    - `Kivo-Platform`: what it runs on, a `ClientPlatform` value.
    - `Kivo-OS-Version`: the operating system's version.
    - `Kivo-Device-Model`: the device's model, coarse: Android's
      `Build.MODEL`, an Apple machine identifier such as `iPhone16,2`, or the
      browser's family and major version.

    Each value is printable ASCII, at most 100 characters; the server leaves
    out one that isn't. A session keeps the
    identity it signed in with, and takes a changed one from its next
    request; a play takes it from its start request. The server shows it
    to the account and to admins, and sends it nowhere else. The screen's
    size and the device's own name aren't sent.

    ## Authentication

    Signing in makes a session. The web client's is a `browser` session,
    which uses the `HttpOnly`, `SameSite=Strict` session cookie set at
    sign-in (named `__Host-kivo_session` over TLS). An app's is an `app`
    session, whose token it sends as `Authorization: Bearer <token>`. An
    `Authorization` header with another scheme is ignored, and the session
    cookie counts. Tokens are never accepted in query strings. Answers are
    `Cache-Control: no-store`, except media, images and fonts. Unsafe methods on a cookie session
    need a same-origin `Origin` header. An app signs in with
    `POST /api/v1/sessions` and a password, or by linking: it creates a
    code with `POST /api/v1/device-codes`, shows the code and `linkUrl`,
    and polls `POST /api/v1/device-codes/poll` every `interval` seconds
    until a signed-in user approves or denies the code. A browser can link
    the same way, as a `browser` link. A `401`, or the live-events socket
    closing with 4401, means the session was signed out. Scripts and other
    tools send an API key, which an admin creates under Admin, API keys
    (`POST /api/v1/api-keys`), the same way: `Authorization: Bearer <key>`.
    `GET /api/v1/users/me` is the user behind either.

    Casting gives the Cast receiver a cast token: a signed-in session
    creates one with `POST /api/v1/cast-tokens` and passes it to the
    receiver in the Cast load request. The receiver sends it as
    `Authorization: Bearer <token>` to the `cast` routes, starting and
    running plays as the session's user. It ends when that session does,
    30 minutes after its last use, or 24 hours after it was made, whichever
    comes first; the receiver ends it with
    `DELETE /api/v1/cast-tokens/current` when it closes.

    A user has one session per client. An app sends `clientId`, a random
    ID it makes once per install and keeps, when it signs in or creates
    a device code. A browser gets one from the server: the `HttpOnly`,
    `SameSite=Lax` client cookie (named `__Host-kivo_client` over TLS) set
    when it signs in, which lasts 400 days and outlives signing out. Signing
    in again from a client revokes that user's session on it; another
    user's session on the same client stays.

    ## Finding the server

    `GET /api/v1/server` names the server by its stable `id`, which apps key
    their sign-in by. On the local network, the server advertises itself by
    DNS-SD over multicast DNS as a `_kivo._tcp` service named by its
    `serverName`, on its own host name, `kivo-` and the last six hex digits
    of its ID. The service's TXT record holds `id` (the server's ID), `v`
    (its version), `path` (its base path, empty at the root) and `tls` (`1`
    over HTTPS, else `0`). An app browses for the service, resolves it to an
    address and port, and confirms the ID with `GET /api/v1/server`. The
    server needs host networking to be seen.

    ## Live events

    `GET /api/v1/events` upgrades to a WebSocket. The server sends
    `EventStreamMessage` frames as JSON text: a `snapshot` first, then
    `event` hints carrying only IDs and counts, and `resync` when the client
    fell behind. There are no sequence numbers; a client that reconnects
    applies the new snapshot and refetches what it keeps live.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: The server itself, under its configured base path (such as `/kivo`).
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: setup
    description: First-run setup and server settings.
  - name: sessions
    description: Signing in and out, and where a user is signed in.
  - name: api-keys
    description: Keys for scripts and other tools.
  - name: users
    description: Users, invite links and the caller's own preferences.
  - name: libraries
    description: Libraries, their grids, folders and scans.
  - name: works
    description: Detail pages, children, collections, search, Home and the item admin menu.
  - name: files
    description: Media files, for Show files and the Missing files list.
  - name: tasks
    description: Background work, for the Tasks page.
  - name: plays
    description: Starting and controlling playback.
  - name: history
    description: Watch history.
  - name: downloads
    description: Offline media on phones and tablets.
  - name: media
    description: Playlists, segments, files, subtitles and previews of a play, and the files and subtitles of a download. Served by hand-written handlers.
  - name: images
    description: Pre-resized artwork. Served by a hand-written handler.
  - name: events
    description: The live-events WebSocket. Served by a hand-written handler.
  - name: health
    description: Liveness, the problems page and the server log.

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness for Docker and load balancers
      description: Reveals nothing about the server; `503` while it isn't ready.
      tags: [health]
      x-kivo-access: public
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        "503":
          description: The server is starting or shutting down.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}

  /api/v1/setup:
    get:
      operationId: getSetup
      summary: Whether first-run setup is needed
      tags: [setup]
      x-kivo-access: public
      security: []
      responses:
        "200":
          description: Setup state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SetupState"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: completeSetup
      summary: Create the admin user and sign in
      description: |
        Only before any user exists; afterwards `409` with code
        `alreadySetUp`. Sets the session cookie for browser sessions.
      tags: [setup]
      x-kivo-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionCreate"}
      responses:
        "201":
          description: The admin user exists and this client is signed in.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetSessionCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/server:
    get:
      operationId: getServer
      summary: The server's ID, name and version, and for a signed-in client its addresses and quality ladder
      description: |
        Signed out, only `id`, `name` and `version`. A client keeps its
        sign-in under `id`, which stays the same across restarts and address
        changes, and tries a local URL first and the public one elsewhere.
        Signed in, it also gets the quality ladder every client's quality
        menu shows.

        An app that holds a session sends `challenge` and `probeId` before
        it trusts a plain-HTTP address with its token, and the server
        answers with its `proof` that it holds that session.
      tags: [setup]
      x-kivo-access: public
      x-kivo-receiver: true
      security: [{}, {cookieAuth: []}, {bearerAuth: []}]
      parameters:
        - name: challenge
          in: query
          description: 16 to 64 random bytes, new for each probe, base64url without padding.
          schema: {type: string, minLength: 22, maxLength: 86}
        - name: probeId
          in: query
          description: |
            The app's session's probe ID, base64url without padding: the
            first 16 bytes of SHA-256("kivo-probe-id" ‖ SHA-256(token)).
          schema: {type: string, minLength: 22, maxLength: 22}
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServerInfo"}
        "400": {$ref: "#/components/responses/BadRequest"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/settings:
    get:
      operationId: getSettings
      summary: Server settings
      tags: [setup]
      x-kivo-access: admin
      responses:
        "200":
          description: The current settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateSettings
      summary: Change server settings
      tags: [setup]
      x-kivo-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SettingsUpdate"}
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/directories:
    get:
      operationId: listDirectories
      summary: Folders on the server, for the library folder picker
      description: |
        Without `path`, / and the mounts that could hold media. With it, that
        folder's subfolders, sorted by name.
      tags: [setup]
      x-kivo-access: admin
      parameters:
        - name: path
          in: query
          description: An absolute folder path on the server.
          schema: {type: string}
      responses:
        "200":
          description: Subfolders.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DirectoryList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/accelerators:
    get:
      operationId: listAccelerators
      summary: Video accelerators, for the transcoding settings
      description: |
        What the startup test found: the GPUs and other video accelerators
        that passed, best first, with what each does, then those found that
        can't be used, each with its `problem`. The CPU isn't one: video no
        accelerator encodes is encoded on the CPU. Choose one with the
        `accelerator` setting.
      tags: [setup]
      x-kivo-access: admin
      responses:
        "200":
          description: The accelerators.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AcceleratorList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/content-ratings:
    get:
      operationId: listContentRatings
      summary: The content rating country's content ratings
      description: |
        The content ratings of the server's content rating country, or of a
        work's library's own, with the minimum age each means, in the order
        the content rating filter and the edit dialog show them. Empty for a
        country Kivo has no list for.
      tags: [works]
      x-kivo-access: viewer
      parameters:
        - name: workId
          in: query
          description: A work the caller sees, for its library's content rating country.
          schema: {$ref: "#/components/schemas/ID"}
      responses:
        "200":
          description: The content ratings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ContentRatingList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/sessions:
    get:
      operationId: listSessions
      summary: Where a user is signed in, most recently used first
      description: |
        The browsers and apps the caller is signed in on, or with
        `userId` an admin's look at any user's. Another user's, for
        anyone but an admin, is `404`.
      tags: [sessions]
      x-kivo-access: signedIn
      parameters:
        - name: userId
          in: query
          description: The user; the caller's own when absent.
          schema: {$ref: "#/components/schemas/ID"}
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createSession
      summary: Sign in with a password
      description: |
        A `browser` session sets the session cookie; an `app` session
        returns its token once, in `token`. Every failure is `401` with code
        `invalidCredentials`, whatever went wrong; repeated failures are
        `429` with code `throttled` and a `Retry-After` header.
      tags: [sessions]
      x-kivo-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionCreate"}
      responses:
        "201":
          description: Signed in.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetSessionCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteOtherSessions
      summary: Sign out everywhere else
      description: |
        Revokes every session of the caller's user but the caller's own;
        API keys stay. Each client's next request is `401`, and its
        live-events socket closes with 4401 at once. An API key's caller
        has no session to keep, so gets `404`.
      tags: [sessions]
      x-kivo-access: signedIn
      parameters:
        - name: except
          in: query
          required: true
          description: The session to keep; only `current`, the caller's own.
          schema:
            type: string
            enum: [current]
      responses:
        "204":
          description: Signed out everywhere else.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/sessions/current:
    get:
      operationId: getCurrentSession
      summary: The caller's session
      description: An API key is no session, so its caller gets `404`.
      tags: [sessions]
      x-kivo-access: signedIn
      responses:
        "200":
          description: The caller's session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteCurrentSession
      summary: Sign out
      description: |
        Revokes the caller's session and clears the cookie. An API key's
        caller gets `404`; a key is revoked with
        `DELETE /api/v1/api-keys/{id}`.
      tags: [sessions]
      x-kivo-access: signedIn
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetSessionCookie"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/sessions/{id}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: getSession
      summary: One session
      description: One of the caller's own, or any for an admin; anyone else's is `404`.
      tags: [sessions]
      x-kivo-access: signedIn
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateSession
      summary: Rename a browser or app
      description: |
        One of the caller's own sessions, or any for an admin; anyone
        else's is `404`. The name shows where the user is signed in and
        with the session's plays.
      tags: [sessions]
      x-kivo-access: signedIn
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionUpdate"}
      responses:
        "200":
          description: The renamed session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteSession
      summary: Sign a browser or app out
      description: |
        One of the caller's own sessions, or any for an admin;
        anyone else's is `404`. The client's next request is `401`, and its
        live-events socket closes with 4401 at once.
      tags: [sessions]
      x-kivo-access: signedIn
      responses:
        "204":
          description: Signed out.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/api-keys:
    get:
      operationId: listApiKeys
      summary: Every API key, newest first
      tags: [api-keys]
      x-kivo-access: admin
      responses:
        "200":
          description: The API keys.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiKeyList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createApiKey
      summary: Create an API key
      description: |
        The response carries the key's `token`, once; only its hash is kept.
        A script sends it as `Authorization: Bearer <token>`, as an app sends
        its session's token. The key has the admin access of the user
        that created it, until it's revoked or that user loses admin.
      tags: [api-keys]
      x-kivo-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApiKeyCreate"}
      responses:
        "201":
          description: The new key, with its token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiKey"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/api-keys/{id}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: getApiKey
      summary: One API key
      tags: [api-keys]
      x-kivo-access: admin
      responses:
        "200":
          description: The API key.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiKey"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteApiKey
      summary: Revoke an API key
      description: Its next request is `401`, and its live-events sockets close with 4401 at once.
      tags: [api-keys]
      x-kivo-access: admin
      responses:
        "204":
          description: Revoked.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/device-codes:
    post:
      operationId: createDeviceCode
      summary: Start signing a device in by code
      description: |
        The device shows `code` and `linkUrl` (with a QR code of `linkUrl`),
        and polls with `secret` every `interval` seconds until a signed-in
        user approves or denies the code. The code is 6 characters, works
        once and expires after 5 minutes; create another for a new one. Too
        many codes pending from one address, or one IPv6 /64, is `429` with
        code `throttled`.
      tags: [sessions]
      x-kivo-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeviceCodeCreate"}
      responses:
        "201":
          description: The code is waiting for approval.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeviceCode"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/device-codes/poll:
    post:
      operationId: pollDeviceCode
      summary: Whether a device code was approved
      description: |
        `202` while the code waits; `201` with the session once it's
        approved, then the secret is spent. An `app` link's session carries
        its token; a `browser` link's sets the session and client cookies,
        as `POST /api/v1/sessions` does. A denied code is `403` with code
        `denied`. An unknown secret, or a code that expired or was used, is
        `410` with code `expired`. Guessed secrets back off as failed
        sign-ins do (`429` with code `throttled`).
      tags: [sessions]
      x-kivo-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeviceCodePoll"}
      responses:
        "201":
          description: Approved; this device is signed in.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "202":
          description: Still waiting for approval.
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "410": {$ref: "#/components/responses/Gone"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/device-codes/{code}:
    parameters:
      - {$ref: "#/components/parameters/UserCode"}
    get:
      operationId: getDeviceCode
      summary: The device waiting on a code
      description: |
        Shown before approving. A code that is unknown, expired or already
        answered is `404`; guessed codes back off as failed sign-ins do.
      tags: [sessions]
      x-kivo-access: signedIn
      responses:
        "200":
          description: The waiting device.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PendingDevice"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/device-codes/{code}/approve:
    parameters:
      - {$ref: "#/components/parameters/UserCode"}
    post:
      operationId: approveDeviceCode
      summary: Let the device waiting on a code sign in as the caller
      description: |
        Its next poll gets a session for this user. A code that is
        unknown, expired or already answered is `404`; guessed codes back
        off as failed sign-ins do.
      tags: [sessions]
      x-kivo-access: signedIn
      responses:
        "204":
          description: Approved.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/device-codes/{code}/deny:
    parameters:
      - {$ref: "#/components/parameters/UserCode"}
    post:
      operationId: denyDeviceCode
      summary: Refuse the device waiting on a code
      description: |
        The code is spent, and the device's next poll is `403` with code
        `denied`. A code that is unknown, expired or already answered is
        `404`; guessed codes back off as failed sign-ins do.
      tags: [sessions]
      x-kivo-access: signedIn
      responses:
        "204":
          description: Denied.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/cast-tokens:
    post:
      operationId: createCastToken
      summary: Give a Cast receiver a token to play as this user
      description: |
        A token the receiver sends to the `cast` routes, returned once,
        with the addresses to reach the server by. It belongs to the
        caller's session: signing that session out ends it. An API key's
        caller, or a cast token's, has no session to give one, so gets
        `404`.
      tags: [sessions]
      x-kivo-access: signedIn
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CastTokenCreate"}
      responses:
        "201":
          description: The token, shown once.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CastToken"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/cast-tokens/current:
    delete:
      operationId: deleteCurrentCastToken
      summary: End the caller's cast token
      description: A receiver closing ends its token. Any caller but a cast token's gets `404`.
      tags: [sessions]
      x-kivo-access: cast
      responses:
        "204":
          description: Ended.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/users:
    get:
      operationId: listUsers
      summary: Every user, by username
      tags: [users]
      x-kivo-access: admin
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createUser
      summary: Add a user with a password
      description: |
        A username already in use is `409` with code `nameTaken`. Neither
        every library nor any one of them is `400`.
      tags: [users]
      x-kivo-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserCreate"}
      responses:
        "201":
          description: The new user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: Who the caller is, with its preferences
      description: The user behind the caller's session or API key.
      tags: [users]
      x-kivo-access: viewer
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurrentUser"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateCurrentUser
      summary: Change the caller's preferences
      description: |
        Every client of the user gets the change: playback applies the
        languages, subtitle mode and `rememberTracks` to the next play, and
        `libraries` orders the library list and Home. A
        library the user doesn't see, or one listed twice, is `400`.
      tags: [users]
      x-kivo-access: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CurrentUserUpdate"}
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurrentUser"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/users/me/change-password:
    post:
      operationId: changeCurrentUserPassword
      summary: Change the caller's own password
      description: |
        Needs the current password: a wrong one is `400` with code
        `wrongPassword`, and repeated wrong ones are `429` with code
        `throttled`, as signing in is. With `signOutOthers`, every other
        session of the user is signed out, its live-events sockets closing
        with 4401 at once; the caller's own session and API keys stay.
      tags: [users]
      x-kivo-access: signedIn
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CurrentUserPasswordChange"}
      responses:
        "204":
          description: The password is changed.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/users/{id}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: getUser
      summary: One user
      tags: [users]
      x-kivo-access: admin
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateUser
      summary: Change a user's username, access, limits, admin or disabled state
      description: |
        `libraries`, `limits` and `parental` each replace the user's
        whole setting. A username in use, compared ignoring case, is `409`
        with code `nameTaken`; the user's sessions keep working.
        Disabling a user signs it out everywhere at once.
        A change that would leave no enabled admin is `409` with code
        `lastAdmin`; un-admining or disabling oneself is `409`
        with code `ownUser`.
      tags: [users]
      x-kivo-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserUpdate"}
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteUser
      summary: Delete a user
      description: |
        With its sessions, watch state and history. The last enabled admin
        is `409` with code `lastAdmin`; deleting oneself is `409` with
        code `ownUser`.
      tags: [users]
      x-kivo-access: admin
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/users/{id}/set-password:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    post:
      operationId: setUserPassword
      summary: Set a user's password
      description: Signs the user out of every other session.
      tags: [users]
      x-kivo-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordChange"}
      responses:
        "204":
          description: The password is set.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/invites:
    get:
      operationId: listInvites
      summary: Pending invite links, newest first
      description: Links not yet used, revoked or expired.
      tags: [users]
      x-kivo-access: admin
      responses:
        "200":
          description: The pending invites.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createInvite
      summary: Create an invite link
      description: |
        The response carries the link's `token`, once; the link is the web
        client's `/invite/{token}`. It works once, until it expires.
      tags: [users]
      x-kivo-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InviteCreate"}
      responses:
        "201":
          description: The new invite, with its token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Invite"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/invites/{id}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    delete:
      operationId: deleteInvite
      summary: Revoke an invite link
      tags: [users]
      x-kivo-access: admin
      responses:
        "204":
          description: Revoked; the link stops working at once.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/invite-links/{token}:
    parameters:
      - {$ref: "#/components/parameters/InviteToken"}
    get:
      operationId: getInviteLink
      summary: Who an invite link is from
      description: A link that is unknown, used, revoked or expired is `404`.
      tags: [users]
      x-kivo-access: public
      security: []
      responses:
        "200":
          description: The invite.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteLink"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/invite-links/{token}/accept:
    parameters:
      - {$ref: "#/components/parameters/InviteToken"}
    post:
      operationId: acceptInviteLink
      summary: Create the invited user and sign in
      description: |
        The user gets the username and password chosen here and exactly
        the invite's libraries and limits; the link then stops working. A
        username in use is `409` with code `nameTaken`; a dead link is
        `404`. Sets the session cookie for browser sessions.
      tags: [users]
      x-kivo-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionCreate"}
      responses:
        "201":
          description: The user exists and this client is signed in.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetSessionCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/libraries:
    get:
      operationId: listLibraries
      summary: Libraries the user may see, in its own order
      description: |
        The libraries the user placed (`libraries` in
        `CurrentUserUpdate`), then any others in the order they were added.
      tags: [libraries]
      x-kivo-access: viewer
      responses:
        "200":
          description: Libraries.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LibraryList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createLibrary
      summary: Add a library and start its first scan
      tags: [libraries]
      x-kivo-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LibraryCreate"}
      responses:
        "201":
          description: The new library; its first scan is queued.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Library"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/libraries/{id}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: getLibrary
      summary: One library
      tags: [libraries]
      x-kivo-access: viewer
      responses:
        "200":
          description: The library.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Library"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateLibrary
      summary: Edit a library
      description: |
        A folder removed from `folders` leaves the library's folders at once
        and is no longer scanned; the `library-changes` task purges its
        files from the catalog in the background, and its items leave every
        list as they're purged. Nothing on disk is touched. An added folder
        is scanned.
        A folder still being removed can't be added again until it's
        removed (409). The kind can't change.
      tags: [libraries]
      x-kivo-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LibraryUpdate"}
      responses:
        "200":
          description: The updated library.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Library"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteLibrary
      summary: Remove a library
      description: |
        Takes the library off the library list at once, and asks the
        `library-changes` task to remove its folders and files from the
        catalog in the background; its items leave Home, search and browse
        as they're purged. Nothing on disk is touched. Works keep
        their watch state, and pick it up again if their files are added to
        another library. A library already being deleted is not found.
      tags: [libraries]
      x-kivo-access: admin
      responses:
        "202":
          description: Asked for.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Accepted"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/libraries/{id}/facets:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: getLibraryFacets
      summary: The values a library's filters offer
      description: |
        Genres, content ratings, years, resolutions and dynamic ranges of
        the top-level items the user can see, for the filter menu, and
        whether the library has collections.
      tags: [libraries]
      x-kivo-access: viewer
      responses:
        "200":
          description: The facets.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LibraryFacets"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/libraries/{id}/works:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: listLibraryWorks
      summary: A library's grid
      description: |
        The library's top-level items, sorted and filtered. A movies library
        lists movies, with versions never shown separately; a shows library lists series; a
        videos library lists videos; an audiobooks library lists books.

        A grid, paged by `offset`, with `total` on every page; works with
        the same sort key are listed by title. The first page (offset 0) of
        the title sort also has `letters`.
      tags: [libraries]
      x-kivo-access: viewer
      parameters:
        - name: sort
          in: query
          description: |
            Default `title`. Each sort has one direction: `title` A to Z
            ignoring leading articles, `author` A to Z by the first author's
            name (an audiobooks library; then by title, books with no author
            first), `runtime` shortest first, the rest newest or highest
            first. `lastEpisodeAddedAt` puts the series whose newest episode in
            the library was added most recently first (a shows library; then
            by title). `rating` is the community rating weighted by its vote
            count (as if 50 more votes of 6.5 were cast), so a root work few
            people rated ranks below a well-rated one many people rated;
            `myRating` is the user's own rating. Works without the rating
            come last, by title.
          schema: {$ref: "#/components/schemas/WorkSort"}
        - name: played
          in: query
          schema: {$ref: "#/components/schemas/PlayedFilter"}
        - name: genre
          in: query
          description: Any of these genres.
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
        - name: yearFrom
          in: query
          description: The first year, inclusive.
          schema: {type: integer}
        - name: yearTo
          in: query
          description: The last year, inclusive.
          schema: {type: integer}
        - name: contentRating
          in: query
          description: Any of these content ratings (see `WorkSummary.contentRating`).
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
        - name: resolution
          in: query
          description: Any of these resolutions.
          style: form
          explode: true
          schema:
            type: array
            items: {$ref: "#/components/schemas/Resolution"}
        - name: dynamicRange
          in: query
          description: Any of these dynamic ranges.
          style: form
          explode: true
          schema:
            type: array
            items: {$ref: "#/components/schemas/DynamicRange"}
        - name: favorite
          in: query
          description: Only the user's favorites.
          schema: {type: boolean}
        - name: narratorId
          in: query
          description: The books this person narrated.
          schema: {$ref: "#/components/schemas/ID"}
        - name: matchState
          in: query
          description: Admins only (ignored for others). Only `unmatched` is taken, for unmatched items only.
          schema: {$ref: "#/components/schemas/MatchState"}
        - {$ref: "#/components/parameters/Offset"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of summaries.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkSummaryPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/libraries/{id}/collections:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: listLibraryCollections
      summary: A library's collections
      description: |
        A movies library's movie collections, or a videos library's
        folders, that have a root work in the library the user sees, by name.
        A grid, paged by `offset`, with `total` on every page.
      tags: [libraries]
      x-kivo-access: viewer
      parameters:
        - {$ref: "#/components/parameters/Offset"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of collections.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CollectionSummaryPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/libraries/{id}/authors:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: listLibraryAuthors
      summary: An audiobooks library's authors
      description: |
        The people who wrote the library's books the user sees, by sort
        name, each with role `author` and `workCount` the library's books
        they wrote. A grid, paged by `offset`, with `total` on every page;
        the first page (offset 0) also has `letters`.
      tags: [libraries]
      x-kivo-access: viewer
      parameters:
        - {$ref: "#/components/parameters/Offset"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of people.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PersonSummaryPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/libraries/{id}/book-series:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: listLibraryBookSeries
      summary: An audiobooks library's book series
      description: |
        The series of the library's books the user sees, by sort name. A
        grid, paged by `offset`, with `total` on every page; the first page
        (offset 0) also has `letters`.
      tags: [libraries]
      x-kivo-access: viewer
      parameters:
        - {$ref: "#/components/parameters/Offset"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of series.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BookSeriesSummaryPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/libraries/{id}/scan:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    post:
      operationId: scanLibrary
      summary: Scan files now
      description: Asks for a scan of every folder. Progress arrives in `Library.scan`; `tasksChanged` events say when it moved.
      tags: [libraries]
      x-kivo-access: admin
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScanRequest"}
      responses:
        "202":
          description: Asked for.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Accepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/libraries/{id}/stop-scan:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    post:
      operationId: stopLibraryScan
      summary: Stop the library's scan
      description: |
        Its files in flight stop shortly after, as the `scan-libraries`
        task's do when it's stopped; `tasksChanged` events say when it
        moved.
      tags: [libraries]
      x-kivo-access: admin
      responses:
        "204":
          description: Stopped.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/libraries/{id}/refresh-metadata:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    post:
      operationId: refreshLibraryMetadata
      summary: Refresh all metadata
      description: |
        Does for every item what its own Refresh metadata does: each
        matched movie, series, season, episode and video is due a refresh,
        and asked for of the `refresh-metadata` task, and each unmatched
        item's folders are identified again by a scan of the library.
        Locked fields and chosen artwork are kept. `queued` counts the
        items; progress shows on the `refresh-metadata` task.
      tags: [libraries]
      x-kivo-access: admin
      responses:
        "202":
          description: Asked for.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Accepted"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/home:
    get:
      operationId: getHome
      summary: The user's Home rows
      description: Empty rows are left out.
      tags: [works]
      x-kivo-access: cast
      responses:
        "200":
          description: Home.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Home"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/favorites:
    get:
      operationId: listFavorites
      summary: The works the user marked a favorite
      description: |
        Favorites in libraries the user sees, most recently marked first:
        one kind with `kind`, else every kind. A page grouped by kind asks
        for each kind's first page, whose `total` says whether it has any.
        Summaries are as everywhere: an episode's has its series' title and
        poster and its season and episode numbers. A grid, paged by
        `offset`, with `total` on every page; works marked at the same time
        are listed by title.
      tags: [works]
      x-kivo-access: viewer
      parameters:
        - name: kind
          in: query
          schema: {$ref: "#/components/schemas/WorkKind"}
        - {$ref: "#/components/parameters/Offset"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of summaries.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkSummaryPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/works:
    patch:
      operationId: updateWorks
      summary: Edit fields of several books at once
      description: |
        A batch edit from a multi-select in an audiobooks library: each field
        sent is written to every book and locked there, as editing each one
        would. `series` puts the books in that series as their only one,
        keeping each book's position in its primary series or clearing it,
        or with an empty name takes them out of every series. Answers with
        the edited books' summaries. Every work must be a book (`400` with field
        code `notABook` otherwise).
      tags: [works]
      x-kivo-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorksUpdate"}
      responses:
        "200":
          description: The edited books.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkSummaryList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/works/{id}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: getWork
      summary: A work's detail page
      description: Versions in libraries the user can't see are left out.
      tags: [works]
      x-kivo-access: cast
      responses:
        "200":
          description: The work.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateWork
      summary: Edit fields
      description: |
        Each field sent is saved and locked, so refreshes keep it. Setting
        `lockedFields` replaces the set of locked fields, which is how a field
        is unlocked. `series.ordering` changes a series' episode ordering and
        renumbers its episodes without touching watch state.
      tags: [works]
      x-kivo-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkUpdate"}
      responses:
        "200":
          description: The updated work.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/works/{id}/children:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: listWorkChildren
      summary: A series' seasons or a season's episodes
      description: |
        A series' seasons, Specials last, or a season's episodes, in order,
        all of them in one response. Another work has none.
      tags: [works]
      x-kivo-access: viewer
      responses:
        "200":
          description: The children.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkSummaryList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/works/{id}/user-state:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    patch:
      operationId: updateWorkUserState
      summary: Mark played or unplayed, favorite or not, or report an offline position
      description: |
        For the caller. Marking a series or season played or
        unplayed applies to each of its episodes; marking unplayed clears the
        resume position.

        `positionMs`, `playedAt` and `versionId` report where a download was
        played to with no server contact, from the app's progress outbox.
        The position is applied only when `playedAt` is newer than the work's last
        update, so the latest play wins wherever it was; an older one is ignored. Then the usual rules apply: a video is
        finished at the played threshold, a book with 5 minutes or less
        left, and the play shows in watch history. A version that isn't
        the work's is `404`.
      tags: [works]
      x-kivo-access: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserStateUpdate"}
      responses:
        "200":
          description: The work's state for this user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserState"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/works/{id}/matches:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: listWorkMatches
      summary: Provider search for Fix match and a book's Match
      description: |
        Searches the providers for the work's kind (movies for a movie,
        series for a series or episode, Audible's books for a book), best
        first. Without `query`, the work's parsed title and year are used,
        and for a book its title and first author. A query of the form
        `tmdb-438631` or `tvdb-81189`, or for a book an ASIN
        (`B08G9PRS1K`), looks that ID up directly. A book is searched for in
        Audible's store for its library's content rating country. This is
        the one request that calls a provider; it gives up after 10 seconds
        with `503` and code `providerUnavailable`.
      tags: [works]
      x-kivo-access: admin
      parameters:
        - name: query
          in: query
          schema: {type: string}
        - name: year
          in: query
          description: Movies and series.
          schema: {type: integer}
        - name: author
          in: query
          description: Books. Without `query`, the book's first author.
          schema: {type: string}
        - name: provider
          in: query
          description: |
            `tmdb`, `tvdb` or `audible`. Default the library's provider.
          schema: {$ref: "#/components/schemas/ExternalProvider"}
      responses:
        "200":
          description: Matches, best first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MatchList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/works/{id}/match:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    post:
      operationId: matchWork
      summary: Fix match
      description: |
        Re-describes the work's root work (an episode's or season's series)
        as the chosen match, in place: the root work keeps its
        ID, watch state and history, takes the match's ID and is refreshed
        from it, and the match is locked against automatic changes. A
        series' episodes are looked up again under it.
        Returns the work, or its root work when the work was an episode the new
        match doesn't have. For a book this is Match: the match's ASIN
        becomes the book's, locked as an edit is, and the book's details are
        refreshed in the background.
      tags: [works]
      x-kivo-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FixMatchRequest"}
      responses:
        "200":
          description: The matched work.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/works/{id}/unmatch:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    post:
      operationId: unmatchWork
      summary: Unmatch
      description: |
        Returns a movie or series to unmatched, the state of files nothing
        matched: provisional, titled from its files' names, with no provider
        metadata or artwork. A series' seasons and episodes become
        provisional too, numbered from their names. Watch state is kept. The
        work is locked, so automatic matching leaves it alone until Fix
        match. Returns the unmatched work.
      tags: [works]
      x-kivo-access: admin
      responses:
        "200":
          description: The provisional work.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/works/{id}/refresh-metadata:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    post:
      operationId: refreshWorkMetadata
      summary: Refresh metadata
      description: |
        Locked fields and chosen artwork are kept. For a series, includes its
        seasons and episodes. An unmatched work's folders are identified
        again instead.
      tags: [works]
      x-kivo-access: admin
      responses:
        "202":
          description: Asked for.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Accepted"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/works/{id}/artwork:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: listWorkArtwork
      summary: Artwork to choose from
      description: |
        Per type, the work's current artwork first (`selected`), then the
        image files next to its media, newest first, then TMDb's images in
        the metadata language and textless ones, best first. Each image is
        shown through `GET /api/v1/images/{id}`, artwork not yet chosen as a preview
        made the first time it's asked for; provider URLs are never sent.
        Without `type`, every type the work has: `poster`, `backdrop` and
        `logo` for a movie, series or other video, `poster` for a season,
        `still` for an episode.
      tags: [works]
      x-kivo-access: admin
      parameters:
        - name: type
          in: query
          schema: {$ref: "#/components/schemas/ArtworkType"}
      responses:
        "200":
          description: Artwork.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArtworkList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: uploadWorkArtwork
      summary: Upload artwork
      description: |
        The image is size-checked and re-encoded before it's stored; SVG is
        refused. The upload becomes the selected artwork of its type, which
        refreshes keep.
      tags: [works]
      x-kivo-access: admin
      x-kivo-upload: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/ArtworkUpload"}
      responses:
        "201":
          description: The uploaded artwork.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Artwork"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/works/{id}/artwork/{artworkId}/select:
    parameters:
      - {$ref: "#/components/parameters/ID"}
      - name: artworkId
        in: path
        required: true
        schema: {$ref: "#/components/schemas/ID"}
    post:
      operationId: selectWorkArtwork
      summary: Choose artwork
      description: |
        Makes an image `listWorkArtwork` listed the work's artwork of its
        type: artwork not yet chosen is fetched or read in full and re-encoded like any
        artwork. Refreshes keep it.
      tags: [works]
      x-kivo-access: admin
      responses:
        "200":
          description: The chosen artwork.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Artwork"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/collections/{id}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: getCollection
      summary: A collection's page
      description: |
        A movie collection or a videos library's folder, with its root works
        the user sees in release order, all of them in one response. A
        collection with none is not found.
      tags: [works]
      x-kivo-access: viewer
      responses:
        "200":
          description: The collection.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Collection"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/unmatched-works:
    get:
      operationId: listUnmatchedWorks
      summary: The Unmatched list
      description: |
        Every library's unmatched items, library by library and each by
        title, each summary with its `path`. A feed, read in order by
        `after`.
      tags: [works]
      x-kivo-access: admin
      parameters:
        - {$ref: "#/components/parameters/After"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page of summaries.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkSummaryFeed"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/people/{id}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: getPerson
      summary: A person's page
      description: |
        What they're credited on that the profile can see: the movies, shows
        and videos, and the books, those they wrote grouped by series in
        series order then standalone, and those they narrated. Someone
        credited on nothing the profile sees is not found.
      tags: [works]
      x-kivo-access: viewer
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Person"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      operationId: updatePerson
      summary: Rename an author or narrator
      description: |
        Renaming to the name of someone else merges the two, as
        Audiobookshelf does: the books move to that person, whose page this
        answers with. Each book's authors or narrators are locked, so a
        rescan keeps the change.
      tags: [works]
      x-kivo-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NameUpdate"}
      responses:
        "200":
          description: The person the books now credit.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Person"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/book-series/{id}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: getBookSeries
      summary: A book series' page
      description: Its books the profile can see, in series order. A series with none is not found.
      tags: [works]
      x-kivo-access: viewer
      responses:
        "200":
          description: The series.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BookSeries"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateBookSeries
      summary: Rename a book series
      description: |
        Renaming to the name of another series merges the two: the books
        move to that series, keeping their positions, and this answers with
        it. Each book's series are locked, so a rescan keeps the change.
      tags: [works]
      x-kivo-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NameUpdate"}
      responses:
        "200":
          description: The series the books are now in.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BookSeries"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/search:
    get:
      operationId: searchWorks
      summary: Search works, people and collections across visible libraries
      description: |
        Matches words: runs of letters and digits, without case or
        diacritics, so "spider man" finds Spider-Man. Every word must match a
        whole word, except the last, which matches the start of one, as the
        query is typed. A query with no words finds nothing. Works match by
        their titles, alternative titles or the people credited on them, and
        come best first: a title that is the query (a leading "The", "A" or
        "An" ignored), then one starting with it, one holding it as a
        phrase, one holding its words, then alternative titles, then people
        only; within each, the most voted first. Clients group them by
        kind. People match by name, ranked the same way, then by credits,
        and collections by name, ranked the same way; a collection is found
        when the profile sees one of its root works. There's no fuzzy matching,
        and text without spaces between words, such as Japanese, matches
        only from its start. `limit` applies to works, people and
        collections each.
      tags: [works]
      x-kivo-access: viewer
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Matching works and people.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchResults"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/works/{id}/files:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: listWorkFiles
      summary: A work's files, for Show files
      description: |
        Every file of the work's versions, part by part, with paths, sizes
        and tracks, all in one response.
      tags: [files]
      x-kivo-access: admin
      responses:
        "200":
          description: Files.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaFileList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/files:
    get:
      operationId: listFiles
      summary: The Missing files list
      description: |
        Files that are gone, newest missing first, each with its title, of
        every library or with `libraryId` one. A feed, read in order by
        `after`.
      tags: [files]
      x-kivo-access: admin
      parameters:
        - name: status
          in: query
          required: true
          description: The files to list; only `gone`.
          schema:
            type: string
            enum: [gone]
        - name: libraryId
          in: query
          schema: {$ref: "#/components/schemas/ID"}
        - {$ref: "#/components/parameters/After"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Files.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaFileFeed"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}

    delete:
      operationId: deleteMissingFiles
      summary: Delete every missing file now
      description: |
        Forgets every gone file and its versions, as `DELETE
        /api/v1/files/{id}` does one. Works and watch state stay; the disk
        is never touched.
      tags: [files]
      x-kivo-access: admin
      parameters:
        - name: status
          in: query
          required: true
          description: The files to delete; only `gone`.
          schema:
            type: string
            enum: [gone]
      responses:
        "204":
          description: Deleted.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/files/{id}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    delete:
      operationId: deleteFile
      summary: Delete a missing file now
      description: |
        Forgets a gone file and its version, instead of waiting out the 30
        days. Works and watch state stay. Never touches the disk; a file
        that's present is `409`.
      tags: [files]
      x-kivo-access: admin
      responses:
        "204":
          description: Deleted.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/files/{id}/subtitle-results:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: listFileSubtitleResults
      summary: Search OpenSubtitles for a file's subtitles
      description: |
        Searches by the file's hash and its work's IDs, for any user who
        can see the file. Best first: those made for this exact file, then
        full subtitles before forced ones, then those not for the deaf and
        hard of hearing before SDH ones (SDH first when the user's last
        subtitle choice for the series was SDH), then the most downloaded.
        Without an OpenSubtitles key on the server: `503` with code
        `notConfigured`.
      tags: [files]
      x-kivo-access: viewer
      parameters:
        - name: language
          in: query
          description: |
            BCP 47 tags, such as `en`. Default the user's subtitle
            language, else the metadata language (the library's, else the
            server's).
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
      responses:
        "200":
          description: Subtitle results, best first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtitleResultList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/files/{id}/subtitles:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    post:
      operationId: addFileSubtitle
      summary: Add a subtitle from OpenSubtitles
      description: |
        Fetches the subtitle result and stores it on the server, beside the database rather
        than the media, and adds it to the file's tracks with source
        `downloaded` and the result's release as its title, for every user
        who can see the file. It replaces the file's downloaded subtitle in
        its language, forced or not as it is, which leaves the file's tracks,
        and a download that chose that one has this one instead. Any user who can
        see the file may add one. Without an OpenSubtitles key: `503`
        with code `notConfigured`. When OpenSubtitles' daily quota is used
        up: `503` with code `quotaUsed` and, when OpenSubtitles said,
        `resetsAt`. A result OpenSubtitles no longer has: `404`.
      tags: [files]
      x-kivo-access: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FileSubtitleAdd"}
      responses:
        "200":
          description: The new subtitle track.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Track"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: The Tasks page's rows
      description: |
        A row per task, in the order the Tasks page lists them in each of
        its tables: each with when it runs next, its last run, how far its
        work has got and how many of its items failed.
      tags: [tasks]
      x-kivo-access: admin
      responses:
        "200":
          description: The tasks.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/tasks/{task}/run:
    parameters:
      - {$ref: "#/components/parameters/TaskID"}
    post:
      operationId: runTask
      summary: Run a task now
      description: |
        Begins a run of the task, outside the maintenance window too, or
        has its open run, one the night began, go on past the window's
        close. Either works until it's done or stopped. An Activity row has
        no runs: `404`.
      tags: [tasks]
      x-kivo-access: admin
      responses:
        "204":
          description: Running.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/tasks/{task}/stop:
    parameters:
      - {$ref: "#/components/parameters/TaskID"}
    post:
      operationId: stopTask
      summary: Stop a task
      description: |
        Its items in flight stop shortly after, what was asked of it is
        dropped, and its run ends. Nothing is lost: what's left is still
        left for its next run. Downloads and library changes always finish:
        `409` with code `notStoppable`.
      tags: [tasks]
      x-kivo-access: admin
      responses:
        "204":
          description: Stopped.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/tasks/{task}/failures:
    parameters:
      - {$ref: "#/components/parameters/TaskID"}
    get:
      operationId: listTaskFailures
      summary: A task's items that failed
      description: |
        The items that failed for good, newest first: a file that can't be
        read, until it changes or is retried. A task that keeps no failures
        is `404`.
      tags: [tasks]
      x-kivo-access: admin
      responses:
        "200":
          description: The failures.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskFailureList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/tasks/{task}/retry:
    parameters:
      - {$ref: "#/components/parameters/TaskID"}
    post:
      operationId: retryTask
      summary: Retry a task's failed items
      description: |
        Forgets the failures of the items named, or of every one when none
        is, and has them done now. A task that keeps no failures is `404`.
      tags: [tasks]
      x-kivo-access: admin
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskRetry"}
      responses:
        "204":
          description: Asked for.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/activity:
    get:
      operationId: listActivity
      summary: The Activity page
      description: |
        What happened on the server, newest first: plays started and
        finished, root works added, sign-ins and failed ones, users joining,
        task runs ending and problems raised, kept 90 days. Each event's
        fields are nested under its kind's group: `play`, `added`,
        `signIn`, `joined`, `task` or `problem`. Names are as they were
        when it happened. A run of failed sign-ins for one user from one
        address within the hour is one event, its `count` and `occurredAt`
        the latest. An `activityChanged` event says there's more.
      tags: [health]
      x-kivo-access: admin
      parameters:
        - name: group
          in: query
          description: Only these events. Default every one.
          schema: {$ref: "#/components/schemas/ActivityGroup"}
        - {$ref: "#/components/parameters/After"}
        - name: limit
          in: query
          description: Page size; 50 by default.
          schema: {type: integer, minimum: 1, maximum: 200}
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityFeed"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/problems:
    get:
      operationId: listProblems
      summary: The problems page
      description: Open problems, newest first. Resolved problems close themselves.
      tags: [health]
      x-kivo-access: admin
      responses:
        "200":
          description: Problems.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServerProblemList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/problems/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: A problem's opaque ID.
        schema: {type: string}
    delete:
      operationId: dismissProblem
      summary: Dismiss a problem
      description: It stays hidden until it resolves and comes back.
      tags: [health]
      x-kivo-access: admin
      responses:
        "204":
          description: Dismissed.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/users/me/play-events:
    get:
      operationId: listCurrentUserPlayEvents
      summary: The caller's watch history
      description: |
        The caller's plays, newest first, 50 a page by default. A play of a
        work the user can't see now is left out.
      tags: [history]
      x-kivo-access: viewer
      parameters:
        - {$ref: "#/components/parameters/After"}
        - name: limit
          in: query
          description: Page size; 50 by default.
          schema: {type: integer, minimum: 1, maximum: 200}
      responses:
        "200":
          description: Plays.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlayEventFeed"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/play-events:
    get:
      operationId: listPlayEvents
      summary: Every user's watch history
      description: |
        The server-wide watch history: every user's plays, newest first,
        50 a page by default, each with who played it, or with `userId` one
        user's.
      tags: [history]
      x-kivo-access: admin
      parameters:
        - name: userId
          in: query
          description: The user; every user when absent.
          schema: {$ref: "#/components/schemas/ID"}
        - {$ref: "#/components/parameters/After"}
        - name: limit
          in: query
          description: Page size; 50 by default.
          schema: {type: integer, minimum: 1, maximum: 200}
      responses:
        "200":
          description: Plays.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlayEventFeed"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/plays:
    get:
      operationId: listPlays
      summary: What's playing now, for Now playing
      description: Every user's plays, oldest first, with their decisions and transcode diagnostics.
      tags: [plays]
      x-kivo-access: admin
      responses:
        "200":
          description: The plays.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlayList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: startPlay
      summary: Start playback
      description: |
        Plays the version given, or the default one (`PlayCreate`), and
        decides each track from the capabilities in the request; nothing is
        stored per client.
        The play shows which client it's on by the caller's session's or API
        key's name. Over the user's stream limit: `409` with code
        `streamLimit` and the user's plays in `plays`. When the server's video
        transcodes are all in use or its transcode disk is full: `503` with
        code `transcodeBusy` and a `reason` (`transcodeLimit`,
        `storageFull`); try again later. When nothing this client can play
        can be made: `409` with code `notPlayable` and a `reason`.
      tags: [plays]
      x-kivo-access: cast
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlayCreate"}
      responses:
        "201":
          description: The play and where to fetch its media.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlayStarted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/plays/{id}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: getPlay
      summary: One play, for the player's diagnostics
      description: |
        The play as Now playing lists it, with its decision and transcode
        diagnostics. An unknown or ended play is `404`.
      tags: [plays]
      x-kivo-access: admin
      responses:
        "200":
          description: The play.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Play"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      operationId: updatePlay
      summary: The heartbeat; report the position and keep the play alive
      description: |
        Every 10 seconds, and on pause, seek and end: where playback is,
        whether it's playing, and the client's measured download rate. Each
        one also keeps the play alive; a play with no heartbeat or media
        request for 2 minutes expires. Only the play's owner may send it.
        An unknown or expired play is `404`; the client starts a new one at
        its saved position. A play an admin stopped is `410` with code
        `playEnded` and the admin's `message`, for a while after; the client
        stops.
      tags: [plays]
      x-kivo-access: cast
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlayUpdate"}
      responses:
        "204":
          description: Recorded.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410": {$ref: "#/components/responses/PlayEnded"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/plays/{id}/stop:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    post:
      operationId: stopPlay
      summary: Stop playback
      description: |
        Saves the position and ends the play. The owning user, or an
        admin, may stop it; stopping a play that's already gone is `404`.
        Without `positionMs` the play keeps the position its last heartbeat
        reported, as when an admin stops someone else's play. An admin
        stopping someone else's play may give a `message`, which its player
        shows, sent with `playEnded`. A client whose playback failed with
        nothing left to try, its fallback having failed too, stops the play
        with `code`, `positionMs` and `detail`, which the server logs as the
        failure that ended it; its player isn't sent `playEnded`. Only the
        play's owner sends a `code`: from a cast token it is `403`, and an
        admin's stop of someone else's play with one is `404`.
      tags: [plays]
      x-kivo-access: cast
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlayStop"}
      responses:
        "204":
          description: Stopped.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410": {$ref: "#/components/responses/PlayEnded"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/plays/{id}/fallback:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    post:
      operationId: fallbackPlay
      summary: Report a playback failure and retry as a transcode
      description: |
        Ends the failed play and starts a new one at `positionMs` with the
        same version and tracks, transcoding everything: nothing played
        directly or copied, and a selected subtitle burned in rather than
        drawn by the client. A video transcode that was on an accelerator is
        on the CPU. Each track's reason is `fallback` unless it already had
        one. The client plays the returned play, and asks once per play.
        When the failed play already transcoded everything on the CPU, it
        ends and there's nothing else to try: `409` with code `noFallback`.
        The new play can be refused as a start is.
      tags: [plays]
      x-kivo-access: cast
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlayFallback"}
      responses:
        "201":
          description: The new play and where to fetch its media.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlayStarted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "410": {$ref: "#/components/responses/PlayEnded"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/bandwidth-test:
    get:
      operationId: getBandwidthTest
      summary: Bytes to time a download by, for Auto quality
      description: |
        `size` bytes that don't compress, which a client times to measure
        its download rate from the server before its first remote play.
        A client on the server's local networks gets `204` instead and
        plays without a measurement.
      tags: [plays]
      x-kivo-access: cast
      parameters:
        - name: size
          in: query
          required: true
          description: How many bytes to send.
          schema: {type: integer, minimum: 1, maximum: 10000000}
      responses:
        "200":
          description: The bytes.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "204":
          description: The client is on a local network.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/plays/{id}/hls/{name}:
    parameters:
      - {$ref: "#/components/parameters/PlayID"}
      - {$ref: "#/components/parameters/MediaName"}
    get:
      operationId: getPlayHls
      summary: An HLS playlist, init segment or media segment
      description: |
        Start from `PlayStarted.delivery.url`, the multivariant playlist;
        playlists refer to the rest with relative URIs. A subtitle the
        play streams is a subtitle rendition there, with WebVTT segments
        covering the video's. A segment that isn't ready yet is waited for.
        A segment whose transcode failed is `500` with code
        `transcodeFailed`: report it through the fallback request. Also
        answers `HEAD`.
      tags: [media]
      x-kivo-access: play
      security: []
      responses:
        "200":
          description: A playlist or segment.
          content:
            application/vnd.apple.mpegurl:
              schema: {type: string}
            video/mp4:
              schema: {type: string, format: binary}
            audio/mp4:
              schema: {type: string, format: binary}
            text/vtt:
              schema: {type: string}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/plays/{id}/files/{part}:
    parameters:
      - {$ref: "#/components/parameters/PlayID"}
      - name: part
        in: path
        required: true
        description: The version part, from 0.
        schema: {type: integer, minimum: 0}
    get:
      operationId: getPlayFile
      summary: A version part's original file, for direct play
      description: >-
        Supports range requests. Also answers `HEAD`. The type is the probed
        container's: `video/x-matroska`, `video/webm`, `video/mp4`,
        `video/mp2t` or `video/x-msvideo`, else `application/octet-stream`.
      tags: [media]
      x-kivo-access: play
      security: []
      parameters:
        - name: Range
          in: header
          schema: {type: string}
      responses:
        "200":
          description: The whole file.
          content:
            video/*:
              schema: {type: string, format: binary}
            application/octet-stream:
              schema: {type: string, format: binary}
        "206":
          description: The requested range.
          content:
            video/*:
              schema: {type: string, format: binary}
            application/octet-stream:
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/NotFound"}
        "416":
          description: The range can't be satisfied (code `rangeNotSatisfiable`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/plays/{id}/subtitles/{name}:
    parameters:
      - {$ref: "#/components/parameters/PlayID"}
      - {$ref: "#/components/parameters/MediaName"}
    get:
      operationId: getPlaySubtitle
      summary: A subtitle track
      description: |
        Names come from `PlayStarted.tracks[].url`. Text tracks are
        WebVTT, with cue times on
        the version's timeline; ASS is the original, whose fonts
        `GET /api/v1/fonts/{sha256}` serves; PGS is `.sup`. An embedded
        track that isn't extracted yet is `404` with
        code `notReady`; a play lists such a track as not ready, so clients
        don't ask. Also answers
        `HEAD`.
      tags: [media]
      x-kivo-access: play
      security: []
      responses:
        "200":
          description: The subtitle.
          content:
            text/vtt:
              schema: {type: string}
            text/x-ssa:
              schema: {type: string}
            application/octet-stream:
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/plays/{id}/previews/{name}:
    parameters:
      - {$ref: "#/components/parameters/PlayID"}
      - {$ref: "#/components/parameters/MediaName"}
    get:
      operationId: getPlayPreview
      summary: The preview-thumbnail manifest or one sprite sheet
      description: Start from `PlayStarted.previews.url`, the manifest; it names the sheets. Also answers `HEAD`.
      tags: [media]
      x-kivo-access: play
      security: []
      responses:
        "200":
          description: The manifest or a sheet.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PreviewManifest"}
            image/webp:
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/downloads/check:
    post:
      operationId: checkDownloads
      summary: Whether the user may still have its downloads
      description: |
        For each download an app keeps, whether the user may still
        have it: it has downloads allowed, the work is visible to it, and
        the version still exists as one of the work's. A download that's
        gone and one the user can't see are both unavailable, alike.
        Answers in the order asked.
      tags: [downloads]
      x-kivo-access: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DownloadCheck"}
      responses:
        "200":
          description: Each download's availability.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DownloadCheckResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/downloads/estimate:
    post:
      operationId: estimateDownloads
      summary: What downloading works would be at each quality
      description: |
        For each work, as `POST /api/v1/downloads` would decide it on a
        app with these capabilities: the version, its files' size, and
        each quality's delivery and size, before anything is asked for. A
        video lists `original`, `high` and `standard`; a book only
        `original`. An option whose `asIs` is true sends the original as it
        is, and its size is exact; any other is converted, and its size is
        an estimate from the quality's cap, which a grainy title can
        exceed. A work the user can't see, or with
        no file present, is `playable: false` with no reason, alike; one
        the app can't play, or a user without downloads, has its
        `reason`. Answers in the order asked.
      tags: [downloads]
      x-kivo-access: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DownloadEstimateRequest"}
      responses:
        "200":
          description: Each work's estimate.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DownloadEstimateList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/downloads:
    get:
      operationId: listDownloads
      summary: The session's downloads on the server
      description: |
        The downloads the server keeps for the caller's session,
        newest first, each as `GET /api/v1/downloads/{id}` gives it: what
        an app takes up again after a relaunch or a server restart. A
        download leaves the list when the app deletes it, 7 days after
        it's ready or failed, or when the session ends.
      tags: [downloads]
      x-kivo-access: viewer
      responses:
        "200":
          description: The session's downloads.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DownloadList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createDownload
      summary: Download a work to keep in the app
      description: |
        Decides the download as playback is decided, from the capabilities
        the app plays offline, but always as whole files: the original
        (delivery `file`) where the app plays it and it's no larger than
        the quality's estimate, else a conversion to one MP4 per part
        (delivery `conversion`), a remux where only the container is wrong,
        copying what it can. A book is always its original, and one the
        app can't play is `409` with code `notPlayable` and its
        `reason`; so is a user without downloads
        (`downloadsNotAllowed`). The selected subtitle is kept as a file
        the app draws; for an app that draws none, a text subtitle
        is the conversion's own text track (method `stream`), which the
        player shows as it does a stream's, and any other is burned in.

        A download that needs work on the server (a conversion, or its
        subtitle to prepare) is `queued`, then `preparing`, one at a time
        across the server in the order asked, kept across restarts; then
        `ready`, or `failed` with a reason, which `retry` asks again. The
        rest are `ready` at once. A `downloadsChanged` event says when the
        user's downloads move. Asking again for exactly the same, as
        when an answer was lost, returns the same download, unless it
        failed. Downloads don't count against the user's stream limit,
        nor conversions against the server's video transcodes. A download
        belongs to a session, so an API key's caller gets `404`.
      tags: [downloads]
      x-kivo-access: viewer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DownloadCreate"}
      responses:
        "201":
          description: The download.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Download"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/downloads/{id}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: getDownload
      summary: One of the user's downloads
      description: |
        Where it is: its place in line, how far its preparation has got and
        about how long it has left, or once ready each file's size and
        validator. Anyone else's download is `404`, as is one the server
        has forgotten.
      tags: [downloads]
      x-kivo-access: viewer
      responses:
        "200":
          description: The download.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Download"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteDownload
      summary: Let the server forget a download
      description: |
        The app has every file and has checked them, or no longer wants
        the download. Its preparation stops, its conversion is deleted, and
        its files are no longer served. Without this, the server keeps a
        download for 7 days after it's ready or failed.
      tags: [downloads]
      x-kivo-access: viewer
      responses:
        "204":
          description: Forgotten.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/downloads/{id}/retry:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    post:
      operationId: retryDownload
      summary: Ask again for a failed download
      description: |
        Decides the download afresh, as the files may have changed, and
        puts it at the back of the line. One that hasn't failed is returned
        as it is. It can be refused as a new download is.
      tags: [downloads]
      x-kivo-access: viewer
      responses:
        "200":
          description: The download.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Download"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/downloads/{id}/files/{part}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
      - name: part
        in: path
        required: true
        description: The version part, from 0.
        schema: {type: integer, minimum: 0}
    get:
      operationId: getDownloadFile
      summary: A download's part
      description: >-
        The original, or the converted MP4 once the download is ready
        (before then `404` with code `notReady`), while the user may
        still have it. Supports range requests, with the part's strong
        `ETag` for `If-Range`, so a transfer resumes where it stopped, even
        after the server restarts. Its size and ETag are the download's
        `parts[]`; a conversion's SHA-256 checks it once fetched. Also
        answers `HEAD`.
      tags: [media]
      x-kivo-access: viewer
      parameters:
        - name: Range
          in: header
          schema: {type: string}
        - name: If-Range
          in: header
          schema: {type: string}
      responses:
        "200":
          description: The whole file.
          headers:
            ETag:
              schema: {type: string}
          content:
            video/*:
              schema: {type: string, format: binary}
            audio/*:
              schema: {type: string, format: binary}
            application/octet-stream:
              schema: {type: string, format: binary}
        "206":
          description: The requested range.
          headers:
            ETag:
              schema: {type: string}
          content:
            video/*:
              schema: {type: string, format: binary}
            audio/*:
              schema: {type: string, format: binary}
            application/octet-stream:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "416":
          description: The range can't be satisfied (code `rangeNotSatisfiable`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/downloads/{id}/subtitles/{name}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
      - {$ref: "#/components/parameters/MediaName"}
    get:
      operationId: getDownloadSubtitle
      summary: A subtitle track of a download
      description: |
        Names come from `Download.tracks[].url`, served as a play's
        subtitles are: text as WebVTT on the version's timeline,
        ASS as it is, with its fonts from `GET /api/v1/fonts/{sha256}`. One
        that isn't ready is `404` with code `notReady`. Also answers
        `HEAD`.
      tags: [media]
      x-kivo-access: viewer
      responses:
        "200":
          description: The subtitle.
          content:
            text/vtt:
              schema: {type: string}
            text/x-ssa:
              schema: {type: string}
            application/octet-stream:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/fonts/{sha256}:
    parameters:
      - name: sha256
        in: path
        required: true
        description: The font's SHA-256, in lowercase hex.
        schema: {type: string, pattern: "^[0-9a-f]{64}$"}
    get:
      operationId: getFont
      summary: A font a styled subtitle track uses
      description: |
        A font carried as an attachment by a file the viewer may see, as
        listed in `PlayStarted.tracks[].fonts` and
        `Download.tracks[].fonts`; any other hash, and one that isn't
        stored, is `404`. The bytes for a hash never change: the
        response is cacheable for good (`private, max-age=31536000,
        immutable`) with the weak ETag `W/"<sha256>"`, so a browser fetches
        each font once across sessions. `Content-Type` is read from the
        font's bytes. TrueType, OpenType and collections are gzipped when
        the request accepts it (`Vary: Accept-Encoding`); WOFF and WOFF2 are
        compressed already.
      tags: [media]
      x-kivo-access: viewer
      responses:
        "200":
          description: The font.
          headers:
            Cache-Control:
              schema: {type: string}
            ETag:
              schema: {type: string}
          content:
            font/ttf:
              schema: {type: string, format: binary}
            font/otf:
              schema: {type: string, format: binary}
            font/collection:
              schema: {type: string, format: binary}
            font/woff:
              schema: {type: string, format: binary}
            font/woff2:
              schema: {type: string, format: binary}
        "304":
          description: Not modified.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/images/{id}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      operationId: getImage
      summary: Artwork, pre-resized
      description: |
        Served as WebP at the smallest stored width at least `width` (or the
        largest there is). Cacheable: an image ID's content never changes.
        Public by its ID, which can't be guessed: a cast's artwork is
        fetched by Google Home and the phone's cast notification, which
        hold no credentials.
      tags: [images]
      x-kivo-access: public
      x-kivo-receiver: true
      parameters:
        - name: width
          in: query
          description: Wanted width in CSS pixels times the device pixel ratio.
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: The image.
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            image/webp:
              schema: {type: string, format: binary}
        "304":
          description: Not modified.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/metrics:
    get:
      operationId: getMetrics
      summary: Metrics for Prometheus
      description: The Prometheus text exposition format. Scrape it with an API key.
      tags: [health]
      x-kivo-access: admin
      responses:
        "200":
          description: The metrics.
          content:
            text/plain:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/logs:
    get:
      operationId: listLogs
      summary: The Logs page
      description: |
        The server's recent log lines, kept in memory (the newest 5,000 at
        the server's log level), newest last. Without `after`, the newest
        `limit` lines that match. With `after`, a line's `id` or a `next`
        cursor, the lines after it, oldest first, so a client can ask for
        the lines since the last one it has. Lines hold no tokens or
        play IDs.
      tags: [health]
      x-kivo-access: admin
      parameters:
        - name: level
          in: query
          description: The lowest level to include. Default `info`.
          schema: {$ref: "#/components/schemas/LogLevel"}
        - name: q
          in: query
          description: Only lines whose message or attributes contain this, ignoring case.
          schema: {type: string}
        - {$ref: "#/components/parameters/After"}
        - name: limit
          in: query
          description: Page size; 500 by default.
          schema: {type: integer, minimum: 1, maximum: 5000}
      responses:
        "200":
          description: Log lines.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LogLineFeed"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/logs/file:
    get:
      operationId: getLogFile
      summary: The recent log lines as a file
      description: |
        Every line the Logs page can show, in the server's text log format,
        as an attachment named `kivo-log-<time>.txt`, for attaching to a bug
        report.
      tags: [health]
      x-kivo-access: admin
      responses:
        "200":
          description: The log.
          headers:
            Content-Disposition:
              description: '`attachment; filename="kivo-log-20261010-021500.txt"`, named for the time it was made, in UTC.'
              schema: {type: string}
          content:
            text/plain:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/client-errors:
    post:
      operationId: reportClientError
      summary: Report a script error from a client
      description: |
        A client's uncaught error, for the Logs page: the server writes it at
        Warn with the caller's user and the request's ID, so a failure on a
        TV can be read without the TV's remote inspector. Only the fields here are
        kept, each cut to its limit; anything else in the body is ignored.
        A client sends no URLs with queries, no headers and nothing the user
        typed. Each session may send 10 a minute and each address 30; more
        are dropped with `429` and code `rateLimited`.
      tags: [health]
      x-kivo-access: signedIn
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientErrorReport"}
      responses:
        "204":
          description: Logged.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/events:
    get:
      operationId: openEventStream
      summary: The live-events WebSocket
      description: |
        Upgrades to a WebSocket that carries `EventStreamMessage` frames,
        filtered to what the user may see and to admin-only scopes for
        admins. The server sends a `snapshot` first, then `event` hints, and
        `resync` (followed by a fresh `snapshot`) after the client fell
        behind. Every 25 seconds it also sends a `keepAlive`, so a client
        that hears nothing for a few intervals may take the socket for dead
        and reconnect. Clients ignore a frame of a type they don't know.
        Clients send nothing.

        The web client is authenticated by its session cookie, and its
        upgrade needs a same-origin `Origin`. An app sends its session's
        token, or a script its API key, as `Authorization: Bearer <token>`
        on the upgrade request, as on every other request, and no `Origin` is checked; the
        token never goes in the URL. A client whose WebSocket can't set a
        header, as the packaged TV app's page can't, offers the token as a
        subprotocol instead, `Sec-WebSocket-Protocol: kivo, kivo-bearer.<token>`,
        and the upgrade is answered with `Sec-WebSocket-Protocol: kivo`; no
        `Origin` is checked for it either. Only this upgrade reads the
        subprotocol. Without valid credentials the upgrade is refused with
        `401`.

        The session is rechecked every 30 seconds, and a change in which
        libraries the profile sees, or whether it's an admin, applies with a
        `resync`. The server closes the socket with:

        - `4401` when the session or API key is no longer valid: at once
          when it's signed out or revoked, and within 30 seconds when it expires or its
          user is disabled or deleted. The client is signed out and
          doesn't reconnect.
        - `1001` (going away) when the server is stopping. The client
          reconnects with backoff.

        Any other end, such as a dropped connection, is reconnected with
        backoff; after a reconnect the new `snapshot` stands in for whatever
        was missed.
      tags: [events]
      x-kivo-access: viewer
      parameters:
        - name: Upgrade
          in: header
          required: true
          schema: {type: string, enum: [websocket]}
      responses:
        "101":
          description: Switched to WebSocket. The content describes each frame, not a body.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EventStreamMessage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: kivo_session
      description: The web client's session cookie; `__Host-kivo_session` over TLS.
    bearerAuth:
      type: http
      scheme: bearer
      description: An app session's token or an API key, in the `Authorization` header of every request, the live-events WebSocket's upgrade too, where it may instead be the `kivo-bearer.<token>` subprotocol; never in a URL.

  headers:
    SetSessionCookie:
      description: Sets or clears the session cookie (browser sessions only); a browser signing in also gets the client cookie.
      schema: {type: string}

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    TaskID:
      name: task
      in: path
      required: true
      description: A task's `id` (a `TaskName`).
      schema: {type: string}
    PlayID:
      name: id
      in: path
      required: true
      description: The play's ID; it is the credential for this route.
      schema: {$ref: "#/components/schemas/ID"}
    InviteToken:
      name: token
      in: path
      required: true
      description: The invite link's token; it is the credential for this route.
      schema: {type: string}
    UserCode:
      name: code
      in: path
      required: true
      description: The code the device shows, in any case, with or without spaces or a hyphen.
      schema: {type: string}
    MediaName:
      name: name
      in: path
      required: true
      description: An opaque name produced by the server; clients only follow URLs, never build names.
      schema: {type: string}
    After:
      name: after
      in: query
      description: The `next` cursor from the previous page.
      schema: {type: string}
    Offset:
      name: offset
      in: query
      description: How many items to skip from the start.
      schema: {type: integer, minimum: 0}
    Limit:
      name: limit
      in: query
      description: Page size. The default and the most a page holds depend on the listing.
      schema: {type: integer, minimum: 1, maximum: 200}

  responses:
    BadRequest:
      description: The request is malformed or a field is invalid (code `invalidRequest`).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unauthorized:
      description: No valid session or API key (code `unauthenticated`), or a failed sign-in (code `invalidCredentials`).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: |
        Signed in, but this needs an admin (code `forbidden`); a
        same-origin request (code `crossOrigin`); or a device code that was
        denied (code `denied`).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: No such resource, or the caller may not see it (code `notFound`).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: The resource's state doesn't allow this; the code says why.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Gone:
      description: It expired or was used (code `expired`).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    PlayEnded:
      description: An admin stopped the play (code `playEnded`), with their `message` when they gave one.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    TooManyRequests:
      description: Sign-in throttled (code `throttled`), the server too busy checking passwords or with device codes to take another, or too many client error reports (code `rateLimited`).
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Error:
      description: |
        A server-side failure: `500` (code `internal`, or `transcodeFailed`
        for a play's media), or `503`
        for something unavailable (codes `providerUnavailable` and
        `transcodeBusy`, for now; `notConfigured`, until an admin configures
        it).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}

  schemas:
    ID:
      type: string
      format: uuid
      description: A UUIDv7.
      x-go-type: id.ID
      x-go-type-import:
        path: github.com/mmcdole/kivo/internal/id

    Problem:
      type: object
      description: |
        An RFC 9457 problem document. `code` is stable and is what clients
        translate.
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          description: A URI naming the problem type; `about:blank` when only `code` matters.
        title:
          type: string
          description: A short English summary, for logs.
        status:
          type: integer
        detail:
          type: string
          description: English detail for logs and developers; never internal error text.
        instance:
          type: string
        code: {$ref: "#/components/schemas/ProblemCode"}
        requestId:
          type: string
          description: The request ID, also in the `X-Request-Id` header and the server log.
        reason:
          $ref: "#/components/schemas/RefusalReason"
          description: |
            For `transcodeBusy` and `notPlayable`, why. For `transcodeBusy`:
            `transcodeLimit` or `storageFull`. For `notPlayable`: `noTracks`,
            `fileUnplayable`, `subtitleUnplayable`, `transcodeFailed`,
            `keyframeIndexMissing` or `downloadsNotAllowed`.
        mismatch:
          $ref: "#/components/schemas/CapabilityMismatch"
          description: For `fileUnplayable`, the capability the file failed.
        retryAfterSeconds:
          type: integer
          description: For `throttled` and `rateLimited`, the `Retry-After` header's value.
        errors:
          type: array
          description: For `invalidRequest`, what's wrong with which field.
          items: {$ref: "#/components/schemas/FieldError"}
        plays:
          type: array
          description: For `streamLimit`, the user's plays, to show what is playing where.
          items: {$ref: "#/components/schemas/PlaySummary"}
        message:
          type: string
          description: For `playEnded`, the admin's words to the viewer, when they gave any.
        resetsAt:
          type: string
          format: date-time
          description: For `quotaUsed`, when the quota resets, when the provider said.

    ProblemCode:
      type: string
      description: |
        A problem's stable code, which clients translate. A client that
        doesn't know a code goes by the response's status.
      enum: [invalidRequest, unauthenticated, invalidCredentials, wrongPassword, forbidden,
        crossOrigin, denied, notFound, expired, notReady, rangeNotSatisfiable, conflict, alreadySetUp,
        nameTaken, lastAdmin, ownUser, fileStillPresent, kindMismatch, notStoppable,
        streamLimit, notPlayable, noFallback, playEnded, throttled, rateLimited, providerUnavailable,
        notConfigured, quotaUsed, transcodeBusy, transcodeFailed, internal]

    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: A JSON pointer into the body, or a parameter name.
        code: {$ref: "#/components/schemas/FieldErrorCode"}

    FieldErrorCode:
      type: string
      description: |
        What's wrong with a field: `tooLarge` for a file or list over its
        size, `unsupported` for a file in a format the server doesn't take,
        `unknownEpisodeGroup` for a `group:<ID>` ordering TMDb doesn't list
        for the series, and `notABook` for a work edited with books that
        isn't one.
      enum: [required, invalid, tooShort, tooLong, tooLarge, unsupported, outOfRange,
        unknownEpisodeGroup, notABook]

    Accepted:
      type: object
      description: Background work was asked for; follow it on the Tasks page or through `tasksChanged` events.
      properties:
        queued:
          type: integer
          description: How many items were asked for, when the request asks for many.

    Health:
      type: object
      required: [status]
      properties:
        status: {$ref: "#/components/schemas/HealthStatus"}

    HealthStatus:
      type: string
      description: Whether the server is serving.
      enum: [ok, starting, stopping]

    SetupState:
      type: object
      required: [required, serverName]
      properties:
        required:
          type: boolean
          description: True until the admin user exists.
        serverName:
          type: string
          description: The server's name, for messages such as "Can't reach Living room".

    ServerInfo:
      type: object
      description: The server, as `GET /api/v1/server` gives it.
      required: [id, name, version]
      properties:
        id:
          $ref: "#/components/schemas/ID"
          description: The same across restarts and address changes; apps keep their sign-in under it.
        name:
          type: string
          description: The server's name, from the `serverName` setting.
        version: {type: string}
        castProtocol:
          type: integer
          description: |
            The version of the contract between Cast senders, the Cast
            receiver and the server: the load request's custom data, the
            receiver's status and messages, and the `cast` routes. A receiver
            that speaks another version says which side to update.
        localUrls:
          type: array
          description: |
            Signed in: the server's addresses on
            its local networks, without container, VM or VPN interfaces (a
            VPN only when the asker is on it). The asker's own network comes
            first, then addresses in the `localNetworks` setting, then the
            rest.
          items: {type: string}
        publicUrl:
          type: string
          description: Signed in, when one is set (the `publicUrl` setting), the address to use away from home.
        qualityLadder:
          type: array
          description: |
            Signed in: the quality menu's fixed ladder, highest first, which
            the quality menu, Home and remote quality and a user's remote
            limit offer below Auto and Original. A rung is chosen by sending
            its bitrate as a `limit` quality's `maxBitrateBps`.
          items: {$ref: "#/components/schemas/QualityRung"}
        proof:
          $ref: "#/components/schemas/ServerProof"
          description: With `challenge` and the `probeId` of a session the server holds.

    ServerProof:
      type: object
      description: |
        The server's proof, to an app that holds one of its sessions, of
        where the app's probe reached it. `mac` is HMAC-SHA256, keyed by the
        session's token hash (SHA-256 of the token), over `kivo-probe-v1`,
        then the challenge, the server's `id` and `host`, each after its
        length as two bytes big-endian, then one byte, 1 when `local`.
      required: [mac, host, local]
      properties:
        mac:
          type: string
          description: Base64url without padding.
        host:
          type: string
          description: The host the probe reached, as its `Host` header, or a trusted proxy's `X-Forwarded-Host`, names it.
        local:
          type: boolean
          description: |
            Whether the probe came from a local address, after the trusted
            proxies, as the `localNetworks` setting defines one.

    Settings:
      type: object
      required: [serverName, metadataLanguage, contentRatingCountry, playedThreshold, openSubtitlesKey,
        openSubtitlesUsername, openSubtitlesPasswordSet, fileWatching, localNetworks, accelerator,
        videoTranscodeLimit, maintenanceStartHour, maintenanceEndHour, previewsAtOnce, markersAtOnce, publicUrl,
        remoteQualityCapBps]
      properties:
        serverName:
          type: string
          description: Shown to clients and on the network.
        metadataLanguage:
          type: string
          description: A BCP 47 tag, such as `en-US`; a library may have its own.
        contentRatingCountry:
          type: string
          description: |
            An ISO 3166-1 alpha-2 code, such as `US`; whose content ratings
            works store and the filter and edit dialog list. A library may
            have its own.
        openSubtitlesKey:
          type: string
          description: An OpenSubtitles API key; without one, subtitles aren't searched or downloaded.
        openSubtitlesUsername:
          type: string
          description: An OpenSubtitles account, which raises the daily download quota; empty for none.
        openSubtitlesPasswordSet:
          type: boolean
          description: Whether the OpenSubtitles account has a password; the password itself is never sent.
        fileWatching:
          type: boolean
          description: |
            Scan a folder as soon as files in it change. Off, changes are
            found by the scan of every library every 12 hours, or a scan an
            admin starts.
        playedThreshold:
          type: number
          format: double
          description: The fraction of a work that, once played, marks it played, such as 0.9.
        localNetworks:
          type: array
          description: |
            CIDR ranges whose clients are local. Empty means private
            (RFC 1918 and unique local), loopback and link-local addresses.
            Another range, such as Tailscale's 100.64.0.0/10, is local only
            once listed.
          items: {type: string}
        accelerator:
          type: string
          description: |
            The video accelerator transcodes use: `auto` (the tested
            accelerators, best first), `none` (the CPU), or one accelerator's
            `id` from `GET /api/v1/accelerators`, such as
            `qsv:/dev/dri/renderD128`.
        videoTranscodeLimit:
          type: integer
          minimum: 0
          description: Simultaneous video transcodes the server runs; 0 is no limit.
        maintenanceStartHour:
          type: integer
          minimum: 0
          maximum: 23
          description: |
            The hour, in the server's time, the nightly maintenance window
            opens: the scheduled tasks start then.
        maintenanceEndHour:
          type: integer
          minimum: 0
          maximum: 23
          description: |
            The hour it closes, after midnight when it's not after the
            start. Maintenance work still running then stops, and goes on
            the next night.
        previewsAtOnce:
          type: integer
          minimum: 1
          maximum: 8
          description: |
            How many files' preview thumbnails are made at once, in the
            maintenance window and outside it.
        markersAtOnce:
          type: integer
          minimum: 1
          maximum: 4
          description: |
            How many files are fingerprinted for intro and credits markers
            at once, in the maintenance window and outside it.
        publicUrl:
          type: string
          description: |
            The address apps use away from home, such as
            `https://kivo.example.com`; empty when the server isn't reachable
            from outside. Signed-in apps get it from `GET /api/v1/server`.
        remoteQualityCapBps:
          type: integer
          format: int64
          minimum: 0
          description: |
            The most a stream outside the local networks may use, for a user
            without a remote streaming limit of their own; 0 is no limit.

    SettingsUpdate:
      type: object
      properties:
        serverName: {type: string}
        metadataLanguage: {type: string}
        contentRatingCountry: {type: string}
        playedThreshold: {type: number, format: double}
        openSubtitlesKey: {type: string}
        openSubtitlesUsername: {type: string}
        openSubtitlesPassword:
          type: string
          description: The OpenSubtitles account's password; empty for none.
        fileWatching: {type: boolean}
        localNetworks:
          type: array
          items: {type: string}
        accelerator: {type: string}
        videoTranscodeLimit: {type: integer, minimum: 0}
        maintenanceStartHour: {type: integer, minimum: 0, maximum: 23}
        maintenanceEndHour: {type: integer, minimum: 0, maximum: 23}
        previewsAtOnce: {type: integer, minimum: 1, maximum: 8}
        markersAtOnce: {type: integer, minimum: 1, maximum: 4}
        publicUrl: {type: string}
        remoteQualityCapBps: {type: integer, format: int64, minimum: 0}

    AcceleratorList:
      type: object
      required: [tested, items]
      properties:
        tested:
          type: boolean
          description: False until the startup test has finished, seconds after the server starts.
        items:
          type: array
          description: The accelerators that passed, best first, then those that can't be used.
          items: {$ref: "#/components/schemas/Accelerator"}

    Accelerator:
      type: object
      description: A GPU or other device that encodes video, and decodes, tone-maps or draws subtitles too where it passed.
      required: [id, backend, name, encoders, decoders]
      properties:
        id:
          type: string
          description: The value for the `accelerator` setting, such as `qsv:/dev/dri/renderD128` or `nvenc:0`.
        backend: {$ref: "#/components/schemas/AcceleratorBackend"}
        name:
          type: string
          description: |
            For people, such as `Intel Quick Sync (QSV)`, `Intel VA-API`,
            `AMD VA-API`, `NVIDIA NVENC`, `Apple VideoToolbox`, or for one
            that can't be used the GPU itself.
        encoders:
          type: array
          description: The codecs it encodes; empty for one that can't be used.
          items: {$ref: "#/components/schemas/AcceleratorEncoder"}
        decoders:
          type: array
          description: Source formats it decodes itself; others are decoded on the CPU.
          items: {$ref: "#/components/schemas/AcceleratorFormat"}
        toneMap:
          $ref: "#/components/schemas/ProcessedOn"
          description: Where HDR is tone-mapped; absent when it can't be.
        burnIn:
          $ref: "#/components/schemas/ProcessedOn"
          description: Where subtitles are drawn; absent when they can't be.
        problem: {$ref: "#/components/schemas/AcceleratorProblem"}

    AcceleratorBackend:
      type: string
      description: The interface an accelerator is driven through.
      enum: [vaapi, qsv, nvenc, videotoolbox]

    ProcessedOn:
      type: string
      description: |
        Where a transcode step runs: on the accelerator, or on the CPU.
      enum: [accelerator, cpu]

    AcceleratorEncoder:
      type: object
      required: [codec, gop]
      properties:
        codec: {$ref: "#/components/schemas/EncoderCodec"}
        gop: {$ref: "#/components/schemas/KeyframePlacement"}

    EncoderCodec:
      type: string
      description: A video codec the server encodes.
      enum: [h264, hevc]

    KeyframePlacement:
      type: string
      description: |
        How keyframes meet the segment grid: `grid` is forced on it, and
        `fixed` is a fixed GOP of one segment, where forcing isn't honored.
      enum: [grid, fixed]

    AcceleratorFormat:
      type: object
      required: [codec, bitDepth]
      properties:
        codec: {type: string}
        bitDepth: {type: integer}

    AcceleratorProblem:
      type: object
      description: Why an accelerator the server found can't be used.
      required: [reason]
      properties:
        reason: {$ref: "#/components/schemas/AcceleratorProblemReason"}
        detail:
          type: string
          description: The error in the system's or ffmpeg's words, such as the group to add the server's user to.

    AcceleratorProblemReason:
      type: string
      description: Why an accelerator can't be used.
      enum: [noDeviceNode, noPermission, noDriver, testFailed]

    Directory:
      type: object
      required: [name, path]
      properties:
        name: {type: string}
        path:
          type: string
          description: Absolute.

    DirectoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Directory"}

    SessionCreate:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 64}
        password: {type: string, minLength: 8, maxLength: 1024}
        kind:
          $ref: "#/components/schemas/SessionKind"
          description: Default `browser`.
        name:
          type: string
          maxLength: 100
          description: The client's name, such as "Living Room" or "Firefox on Linux", shown where the user is signed in and with its plays.
        clientId:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            The app's own random ID for itself, made once per install and
            kept: signing in again with it replaces this user's session on
            that client rather than adding another. A browser sends none;
            its ID is the server's client cookie.

    SessionKind:
      type: string
      description: |
        A `browser` session sets a cookie and expires after 30 idle days; an
        `app` session returns a token that lasts until revoked.
      enum: [browser, app]

    Session:
      type: object
      description: A browser or app a user is signed in on.
      required: [id, kind, name, createdAt, lastUsedAt, current]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        kind: {$ref: "#/components/schemas/SessionKind"}
        name:
          type: string
          description: The client's name, such as "Living Room"; empty when a browser gave none.
        device:
          $ref: "#/components/schemas/ClientDevice"
          description: The app and device, as the session's requests last identified them; absent when they never did.
        createdAt: {type: string, format: date-time}
        lastUsedAt:
          type: string
          format: date-time
          description: When it was last used, to within a few minutes.
        current:
          type: boolean
          description: Whether this is the caller's own session.
        token:
          type: string
          description: App sessions only, and only in the response that created the session.

    SessionUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The client's new name.

    CastTokenCreate:
      type: object
      required: [receiverName, receiverKind]
      properties:
        receiverName:
          type: string
          minLength: 1
          maxLength: 100
          description: The Cast device's name, such as "Living Room TV", shown as the client of the plays it starts.
        receiverKind: {$ref: "#/components/schemas/CastReceiverKind"}

    CastReceiverKind:
      type: string
      description: |
        What plays the cast: `web` the Web Receiver page on any Google
        Cast device, `androidTv` the Android TV app opened by Cast Connect.
      enum: [web, androidTv]

    CastToken:
      type: object
      required: [token, expiresAt, serverId, urls]
      properties:
        token:
          type: string
          description: Shown once. Sent only in the `Authorization` header, never in a URL.
        expiresAt:
          type: string
          format: date-time
          description: The latest it can last; unused for 30 minutes, it ends sooner.
        serverId:
          $ref: "#/components/schemas/ID"
          description: The server's ID, which the receiver checks each address against.
        urls:
          type: array
          description: |
            Addresses for the receiver to try in order, as `localUrls` and
            then `publicUrl` give them to the caller.
          items: {type: string}

    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Session"}

    ApiKey:
      type: object
      description: A key for scripts and other tools, with admin access.
      required: [id, name, createdAt]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        name:
          type: string
          description: What it's for, such as "Home Assistant".
        createdAt: {type: string, format: date-time}
        lastUsedAt:
          type: string
          format: date-time
          description: When it was last used, to within a few minutes; absent until it's used.
        token:
          type: string
          description: Only in the response that created the key.

    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ApiKey"}

    ApiKeyCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}

    DeviceCodeCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The device's own name, such as "Living Room" or "Firefox on Linux", shown before approving and as its session's name.
        kind:
          $ref: "#/components/schemas/SessionKind"
          description: Default `app`. A `browser` link signs in the browser that started it, by cookie.
        clientId:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            The app's own random ID for itself, as at `POST /api/v1/sessions`;
            the approved session replaces the approving user's session on
            that client. A browser sends none; its ID is the server's client
            cookie.

    DeviceCode:
      type: object
      description: A device code waiting for approval.
      required: [code, secret, expiresAt, interval, linkUrl]
      properties:
        code:
          type: string
          description: Six characters to show, from `A` to `Z` without `I` and `O`, and `2` to `9`.
        secret:
          type: string
          description: What the device polls with. Shown only here; never show it.
        expiresAt: {type: string, format: date-time}
        interval:
          type: integer
          description: Seconds between polls.
        linkUrl:
          type: string
          description: |
            The web client's `/link` page with `code` and the server's ID
            (`server`) filled in, at the address the device reached the
            server by; for the QR code. It holds no secret.

    DeviceCodePoll:
      type: object
      required: [secret]
      properties:
        secret: {type: string}

    PendingDevice:
      type: object
      description: The device waiting on a code, for "Allow Living Room to sign in as Anna?".
      required: [name, nearby, startedAt]
      properties:
        name:
          type: string
          description: The device's name, as it gave it.
        platform:
          $ref: "#/components/schemas/ClientPlatform"
          description: What it runs on, as its `Kivo-Platform` header said; absent when it gave none.
        nearby:
          type: boolean
          description: Whether it started from an address on the server's local networks.
        startedAt: {type: string, format: date-time}

    ClientPlatform:
      type: string
      description: What a client runs on.
      enum: [androidTv, appleTv, iPhone, iPad, androidPhone, browser, cast, tizen]

    ClientDevice:
      type: object
      description: |
        An app and the device it runs on, as its identity headers name
        them (Client identity, above).
      properties:
        app:
          type: string
          description: The app, such as `kivo-android` or `kivo-web`.
        appVersion: {type: string}
        platform: {$ref: "#/components/schemas/ClientPlatform"}
        osVersion: {type: string}
        deviceModel:
          type: string
          description: The device's model, coarse, such as `SHIELD Android TV`, `iPhone16,2` or `Firefox 132`.

    CurrentUser:
      type: object
      description: The signed-in user, with its limits and playback preferences.
      required: [id, username, admin, limits, playback]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        username: {type: string}
        admin: {type: boolean}
        limits: {$ref: "#/components/schemas/UserLimits"}
        playback: {$ref: "#/components/schemas/PlaybackPreferences"}

    CurrentUserUpdate:
      type: object
      properties:
        playback: {$ref: "#/components/schemas/PlaybackPreferencesUpdate"}
        libraries:
          type: array
          description: |
            The libraries the user sees, in the order it wants them, each
            pinned or not; it replaces the last order. A library left out is
            pinned after the listed ones, in the order libraries were added,
            as every library is until the user sets this.
          items: {$ref: "#/components/schemas/LibraryChoice"}

    LibraryChoice:
      type: object
      required: [id, pinned]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        pinned:
          type: boolean
          description: Shown in the sidebar and with a Recently Added row on Home.

    User:
      type: object
      description: A user, as admins see it.
      required: [id, username, admin, disabled, onlyAdmin, libraries, limits, parental, createdAt]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        username: {type: string}
        admin:
          type: boolean
          description: Manages the server.
        disabled:
          type: boolean
          description: Can't sign in; its sessions stopped working when it was disabled.
        onlyAdmin:
          type: boolean
          description: |
            The one enabled admin, which can't lose admin, be disabled or be
            deleted (`409` with code `lastAdmin`).
        libraries: {$ref: "#/components/schemas/LibraryAccess"}
        limits: {$ref: "#/components/schemas/UserLimits"}
        parental: {$ref: "#/components/schemas/ParentalControls"}
        createdAt: {type: string, format: date-time}

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/User"}

    LibraryAccess:
      type: object
      description: The libraries a user sees.
      required: [all, libraryIds]
      properties:
        all:
          type: boolean
          description: Every library, including ones added later.
        libraryIds:
          type: array
          description: The libraries it sees when not `all`; empty when `all`.
          items: {$ref: "#/components/schemas/ID"}

    UserLimits:
      type: object
      properties:
        maxStreams:
          type: integer
          minimum: 1
          description: Simultaneous streams. Absent for no limit.
        remoteQualityCapBps:
          type: integer
          format: int64
          minimum: 1
          description: |
            The most a stream outside the local networks may use. Absent for
            no cap of the user's own, when the server's remote streaming
            limit applies. The signed-in user's own (`GET /api/v1/users/me`)
            is the limit that applies to them, theirs or the server's.

    ParentalControls:
      type: object
      required: [blockUnrated]
      properties:
        maxAge:
          type: integer
          minimum: 0
          description: |
            The highest minimum age (`ContentRating.age`) the user sees.
            Absent for no limit.
        blockUnrated:
          type: boolean
          description: |
            Hides video with no content rating: movies, series with their
            seasons and episodes, videos and extras. Books always show.

    UserCreate:
      type: object
      required: [username, password, libraries]
      properties:
        username: {type: string, minLength: 1, maxLength: 64}
        password: {type: string, minLength: 8, maxLength: 1024}
        admin: {type: boolean}
        libraries: {$ref: "#/components/schemas/LibraryAccess"}
        limits: {$ref: "#/components/schemas/UserLimits"}
        parental: {$ref: "#/components/schemas/ParentalControls"}

    UserUpdate:
      type: object
      properties:
        username: {type: string, minLength: 1, maxLength: 64}
        admin: {type: boolean}
        disabled: {type: boolean}
        libraries: {$ref: "#/components/schemas/LibraryAccess"}
        limits: {$ref: "#/components/schemas/UserLimits"}
        parental: {$ref: "#/components/schemas/ParentalControls"}

    PasswordChange:
      type: object
      required: [password]
      properties:
        password: {type: string, minLength: 8, maxLength: 1024}

    CurrentUserPasswordChange:
      type: object
      required: [currentPassword, password, signOutOthers]
      properties:
        currentPassword: {type: string, maxLength: 1024}
        password:
          type: string
          minLength: 8
          maxLength: 1024
          description: The new password.
        signOutOthers:
          type: boolean
          description: Whether to sign out the user's other sessions.

    Invite:
      type: object
      description: A pending invite link.
      required: [id, libraries, limits, createdBy, createdAt, expiresAt]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        libraries: {$ref: "#/components/schemas/LibraryAccess"}
        limits: {$ref: "#/components/schemas/UserLimits"}
        createdBy:
          type: string
          description: The username of the admin who created it.
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        token:
          type: string
          description: Only in the response that created the invite.

    InviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Invite"}

    InviteCreate:
      type: object
      required: [libraries, expiresAt]
      properties:
        libraries: {$ref: "#/components/schemas/LibraryAccess"}
        limits: {$ref: "#/components/schemas/UserLimits"}
        expiresAt: {type: string, format: date-time}

    InviteLink:
      type: object
      description: What the invite page shows before the user is made.
      required: [invitedBy, serverName, expiresAt]
      properties:
        invitedBy:
          type: string
          description: The username of the admin who created it.
        serverName: {type: string}
        expiresAt: {type: string, format: date-time}

    PlaybackPreferences:
      type: object
      description: |
        How the user's plays start, when the request doesn't
        choose tracks. An episode starts with the languages last chosen for
        its series when `rememberTracks` is on.
      required: [subtitleMode, rememberTracks, autoplayNext, bookSpeed]
      properties:
        audioLanguage:
          type: string
          description: |
            The preferred audio language (BCP 47), played when the version
            has it. Absent for the original language: the version's default
            track.
        subtitleLanguage:
          type: string
          description: |
            The preferred subtitle language (BCP 47). Absent for the
            server's metadata language.
        subtitleMode: {$ref: "#/components/schemas/SubtitleMode"}
        rememberTracks:
          type: boolean
          description: |
            Whether an episode starts with the audio and subtitle languages
            last chosen for its series, and choosing tracks for an episode
            remembers them. Off, each episode starts from these preferences.
        autoplayNext:
          type: boolean
          description: |
            Whether up next plays the next episode by itself, counting down
            near the end of an episode. Off, up next shows the next episode
            without counting down, and playback stops at the end.
        bookSpeed:
          type: number
          format: double
          minimum: 0.5
          maximum: 3
          description: |
            The speed books play at, which the audio player sets; 1 is
            normal. Video always plays at normal speed.

    PlaybackPreferencesUpdate:
      type: object
      description: Fields as in `PlaybackPreferences`; an empty language sets it back to its default.
      properties:
        audioLanguage: {type: string, maxLength: 35}
        subtitleLanguage: {type: string, maxLength: 35}
        subtitleMode: {$ref: "#/components/schemas/SubtitleMode"}
        rememberTracks: {type: boolean}
        autoplayNext: {type: boolean}
        bookSpeed: {type: number, format: double, minimum: 0.5, maximum: 3}

    SubtitleMode:
      type: string
      description: |
        When subtitles show: `none` never; `forced` a forced track in the
        audio's language; `smart` full subtitles in the subtitle language when
        the audio isn't in it, else as `forced`; `always` full subtitles in
        the subtitle language, else as `forced`.
      enum: [none, forced, smart, always]

    Library:
      type: object
      description: |
        `folders`, `useLocalMetadata`, `previews`, `markers`, `refreshDays`,
        `metadataLanguage`, `contentRatingCountry`, `unmatchedCount` and
        `scan` are sent to admins only.
      required: [id, name, kind, workCount, pinned]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        name: {type: string}
        pinned:
          type: boolean
          description: |
            Pinned by the user: shown in its sidebar and with a Recently
            Added row on Home. Every library is until the user
            chooses; search finds works in every library either way.
        kind: {$ref: "#/components/schemas/LibraryKind"}
        workCount:
          type: integer
          description: Top-level works the user can see.
        folders:
          type: array
          items: {$ref: "#/components/schemas/LibraryFolder"}
        useLocalMetadata: {type: boolean}
        previews: {$ref: "#/components/schemas/ProcessingSchedule"}
        markers:
          $ref: "#/components/schemas/ProcessingSchedule"
          description: |
            When the library finds its episodes' intro and credits markers
            from their audio and pictures; `never` in a library of any kind
            but `shows`.
        subtitles:
          $ref: "#/components/schemas/ProcessingSchedule"
          description: |
            When the library extracts the embedded subtitles of its files
            with ASS or PGS tracks ahead of a play; a download extracts its
            own file's as it's prepared, whatever this says. `never` in an
            `audiobooks` library.
        refreshDays: {$ref: "#/components/schemas/RefreshDays"}
        metadataLanguage:
          type: string
          description: |
            The language (BCP 47) the library's metadata is fetched in.
            Absent for the server's `metadataLanguage`.
        contentRatingCountry:
          type: string
          description: |
            The country (ISO 3166-1 alpha-2) whose content ratings the
            library's works take. Absent for the server's
            `contentRatingCountry`.
        unmatchedCount:
          type: integer
          description: Unmatched items, for the banner.
        scan: {$ref: "#/components/schemas/LibraryScanStatus"}

    LibraryKind:
      type: string
      description: What a library holds. Skip kinds you don't know.
      enum: [movies, shows, videos, audiobooks]

    ProcessingSchedule:
      type: string
      description: |
        When a library processes its media: its preview thumbnails made, its
        markers found, or its subtitles extracted:
        `never`, `nightly`, or nightly and as media is added
        (`nightlyAndAdded`).
      enum: [never, nightly, nightlyAndAdded]

    RefreshDays:
      type: integer
      description: |
        How often the nightly `queue-refreshes` task refreshes each of a
        library's items' metadata, in days since it was last refreshed; `0`
        never.
      enum: [0, 30, 60, 90]

    LibraryFolder:
      type: object
      required: [id, path, reachable]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        path: {type: string}
        reachable: {type: boolean}
        lastScanAt: {type: string, format: date-time}

    LibraryCreate:
      type: object
      required: [name, kind, folders]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        kind:
          $ref: "#/components/schemas/LibraryKind"
          description: |
            An `audiobooks` library makes no preview thumbnails, so its
            `previews` is `never`, whatever is sent.
        folders:
          type: array
          minItems: 1
          items:
            type: string
            description: An absolute folder path on the server.
        useLocalMetadata:
          type: boolean
          description: Default true.
        previews:
          $ref: "#/components/schemas/ProcessingSchedule"
          description: Default `nightly`.
        markers:
          $ref: "#/components/schemas/ProcessingSchedule"
          description: Default `nightlyAndAdded`; `never` for a library of any kind but `shows`, whatever is sent.
        subtitles:
          $ref: "#/components/schemas/ProcessingSchedule"
          description: Default `nightlyAndAdded`; `never` for an `audiobooks` library, whatever is sent.
        refreshDays:
          $ref: "#/components/schemas/RefreshDays"
          description: Default 30.
        metadataLanguage:
          type: string
          description: Empty or absent for the server's.
        contentRatingCountry:
          type: string
          description: Empty or absent for the server's.

    LibraryUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        folders:
          type: array
          minItems: 1
          items: {type: string}
        useLocalMetadata: {type: boolean}
        previews: {$ref: "#/components/schemas/ProcessingSchedule"}
        markers: {$ref: "#/components/schemas/ProcessingSchedule"}
        subtitles: {$ref: "#/components/schemas/ProcessingSchedule"}
        refreshDays: {$ref: "#/components/schemas/RefreshDays"}
        metadataLanguage:
          type: string
          description: Empty for the server's.
        contentRatingCountry:
          type: string
          description: Empty for the server's.

    LibraryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Library"}

    ContentRating:
      type: object
      required: [name, age]
      properties:
        name:
          type: string
          description: The content rating, such as `PG-13`.
        age:
          type: integer
          minimum: 0
          description: The minimum age it means, which a user's rating ceiling is compared against.

    QualityRung:
      type: object
      required: [bitrateBps, height]
      properties:
        bitrateBps:
          type: integer
          format: int64
        height:
          type: integer
          description: The height in pixels a transcode at this bitrate is sent at, such as 1080.

    ContentRatingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ContentRating"}

    LibraryFacets:
      type: object
      required: [genres, contentRatings, years, narrators, resolutions, dynamicRanges, collections]
      properties:
        narrators:
          type: array
          description: An audiobooks library's narrators, by name, for the narrator filter; empty for other kinds.
          items: {$ref: "#/components/schemas/PersonRef"}
        genres:
          type: array
          description: By name.
          items: {type: string}
        contentRatings:
          type: array
          description: |
            In the order `listContentRatings` gives, then any others youngest
            first; see `WorkSummary.contentRating`.
          items: {type: string}
        years:
          type: array
          description: Release years, ascending.
          items: {type: integer}
        resolutions:
          type: array
          description: The resolution classes of the works' videos, largest first.
          items: {$ref: "#/components/schemas/Resolution"}
        dynamicRanges:
          type: array
          description: The dynamic ranges of the works' videos, `hdr` first.
          items: {$ref: "#/components/schemas/DynamicRange"}
        collections:
          type: boolean
          description: Whether `listLibraryCollections` lists anything.

    ScanRequest:
      type: object
      properties:
        full:
          type: boolean
          description: List every directory, not just changed ones. Default false.

    LibraryScanStatus:
      type: object
      description: |
        What a library's scan is doing, as its row shows it: "Reading files ·
        1,240 of 3,100 · about 4 minutes left".
      required: [libraryId, state]
      properties:
        libraryId: {$ref: "#/components/schemas/ID"}
        state: {$ref: "#/components/schemas/LibraryScanState"}
        progress: {$ref: "#/components/schemas/ScanProgress"}

    LibraryScanState:
      type: string
      description: |
        What a library's scan is doing: `scanning` while it's scanned,
        `unreachable` when a folder can't be read.
      enum: [idle, scanning, unreachable]

    ScanProgress:
      type: object
      description: The step a library's scan is on, and how far it's got.
      required: [step, done, total]
      properties:
        step: {$ref: "#/components/schemas/ScanStep"}
        done: {type: integer}
        total: {type: integer}
        remainingMs:
          type: integer
          description: Estimated time left in the step, when there's a rate to go on.

    ScanStep:
      type: string
      description: |
        A step of a library's scan: `walk` finding files, a folder at a
        time; `probe` reading the files new or changed; `identify` matching
        their folders. Skip steps you don't know.
      enum: [walk, probe, identify]

    Home:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: {$ref: "#/components/schemas/HomeRow"}

    HomeRow:
      type: object
      required: [id, kind, items]
      properties:
        id:
          type: string
          description: Stable per row, such as `recentlyAdded:<libraryId>`.
        kind: {$ref: "#/components/schemas/HomeRowKind"}
        library:
          $ref: "#/components/schemas/LibraryRef"
          description: For `recentlyAdded`, the library.
        items:
          type: array
          items: {$ref: "#/components/schemas/WorkSummary"}

    LibraryRef:
      type: object
      description: A library as a row or list names it.
      required: [id, name, kind]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        name: {type: string}
        kind: {$ref: "#/components/schemas/LibraryKind"}

    HomeRowKind:
      type: string
      description: |
        What a Home row shows: `continueWatching` what to watch on with,
        videos in progress and each series' episode up next;
        `continueListening` books in progress; `continueSeries` the next book of each book series
        the user has finished a book of; `recentlyAdded` a library's newest
        works; `favorites` the works the user marked. Skip kinds you don't
        know.
      enum: [continueWatching, continueListening, continueSeries, recentlyAdded, favorites]

    WorkSummary:
      type: object
      description: |
        The summary of a work, the same everywhere it appears. Kind-specific
        data is under the kind's name.
      required: [id, kind, title, matchState, available, images]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        kind: {$ref: "#/components/schemas/WorkKind"}
        title: {type: string}
        year: {type: integer}
        durationMs:
          type: integer
          description: The default version's duration.
        communityRating:
          type: number
          format: double
          minimum: 0
          maximum: 10
          description: |
            TMDb's community rating of a movie, series or episode: the average
            of its users' votes, 0 to 10. Absent when it has no votes.
        communityVotes:
          type: integer
          minimum: 1
          description: How many votes `communityRating` averages.
        contentRating:
          type: string
          description: |
            The content rating for the server's content rating country, such as
            `PG-13` or `TV-MA`; absent when unrated. On the detail page, a
            season or episode without one has its series'.
        addedAt: {type: string, format: date-time}
        matchState: {$ref: "#/components/schemas/MatchState"}
        available:
          type: boolean
          description: False when every version's folder is unreachable.
        images: {$ref: "#/components/schemas/WorkImages"}
        userState: {$ref: "#/components/schemas/UserState"}
        movie: {$ref: "#/components/schemas/MovieInfo"}
        series: {$ref: "#/components/schemas/SeriesInfo"}
        season: {$ref: "#/components/schemas/SeasonInfo"}
        episode: {$ref: "#/components/schemas/EpisodeInfo"}
        extra: {$ref: "#/components/schemas/ExtraInfo"}
        book: {$ref: "#/components/schemas/BookInfo"}
        libraryId:
          $ref: "#/components/schemas/ID"
          description: |
            The library this work is in. Absent when the user doesn't see
            it.
        path:
          type: string
          description: |
            In the unmatched list only: the folder a series or book was
            parsed from, else the file, as found in its library.
            Absent when it has no file there.

    WorkKind:
      type: string
      description: |
        What a work is: `video` an item of a videos library and `book` an
        item of an audiobooks library. Skip kinds you don't know.
      enum: [movie, series, season, episode, extra, video, book]

    WorkSort:
      type: string
      description: The order of a library's grid (`listLibraryWorks`).
      enum: [title, addedAt, releaseDate, rating, myRating, runtime, lastPlayedAt, author, lastEpisodeAddedAt]

    PlayedFilter:
      type: string
      description: Works by the user's state for them, as the grid's filter asks.
      enum: [unplayed, inProgress, played]

    MatchState:
      type: string
      description: |
        Whether a work is identified: `identifying` is provisional, its first
        identification pending, and `unmatched` provisional with no confident
        match. Provisional items are playable.
      enum: [matched, identifying, unmatched]

    WorkImages:
      type: object
      properties:
        poster: {$ref: "#/components/schemas/ImageRef"}
        backdrop: {$ref: "#/components/schemas/ImageRef"}
        still:
          $ref: "#/components/schemas/ImageRef"
          description: An episode's or video's frame, for landscape cards.
        logo: {$ref: "#/components/schemas/ImageRef"}

    ImageRef:
      type: object
      description: Fetch with `GET /api/v1/images/{id}?width=…`.
      required: [id]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        blurhash: {type: string}
        width:
          type: integer
          description: The largest stored width.
        height: {type: integer}

    UserState:
      type: object
      description: The user's state for a work. For a series or season, `played` means every episode is.
      required: [played, favorite, playCount]
      properties:
        played: {type: boolean}
        favorite: {type: boolean}
        playCount: {type: integer}
        positionMs:
          type: integer
          description: The resume position, when in progress.
        versionId:
          $ref: "#/components/schemas/ID"
          description: |
            The version last played, which `positionMs` is on; it may be
            gone. Resume continues its edition, and a version of another
            edition starts from the beginning.
        lastPlayedAt: {type: string, format: date-time}

    UserStateUpdate:
      type: object
      properties:
        played: {type: boolean}
        favorite: {type: boolean}
        positionMs:
          type: integer
          minimum: 0
          description: An offline position on the version's timeline; needs `playedAt` and `versionId`.
        playedAt:
          type: string
          format: date-time
          description: When the app saw the offline position.
        versionId:
          $ref: "#/components/schemas/ID"
          description: The version the offline position is in, the one downloaded.

    MovieInfo:
      type: object
      properties:
        edition:
          type: string
          description: The label the movie's folder's edition tag gives it, such as `Final Cut`. Shown after the title wherever it appears.

    SeriesInfo:
      type: object
      required: [unplayedCount]
      properties:
        seasonCount:
          type: integer
          description: Detail only.
        unplayedCount:
          type: integer
          description: Unplayed episodes.
        recentlyAddedCount:
          type: integer
          description: In Recently Added, the episodes this summary bundles.
        lastAirYear: {type: integer}
        ordering:
          type: string
          description: Detail only. Documented values `aired`, `dvd`, `absolute`, or `group:<provider episode group ID>`.
        nextUp:
          $ref: "#/components/schemas/WorkSummary"
          description: Detail only. The episode the primary button plays.

    SeasonInfo:
      type: object
      required: [number, seriesId, seriesTitle, unplayedCount]
      properties:
        number:
          type: integer
          description: 0 is Specials.
        seriesId: {$ref: "#/components/schemas/ID"}
        seriesTitle: {type: string}
        episodeCount:
          type: integer
          description: How many episodes the season lists. Set in its series' season list and on its detail.
        unplayedCount: {type: integer}

    EpisodeInfo:
      type: object
      required: [seasonNumber, number, seriesId, seriesTitle]
      properties:
        seasonNumber:
          type: integer
          description: 0 is Specials.
        number: {type: integer}
        endNumber:
          type: integer
          description: The last episode a multi-episode file covers (`E1 to E2`).
        airDate:
          type: string
          format: date
        seriesId: {$ref: "#/components/schemas/ID"}
        seriesTitle: {type: string}
        seasonId: {$ref: "#/components/schemas/ID"}
        previousId:
          $ref: "#/components/schemas/ID"
          description: Detail only. The previous episode in the series' order, across seasons, with specials last. Absent for the first.
        nextId:
          $ref: "#/components/schemas/ID"
          description: Detail only. The next episode in the series' order, across seasons, with specials last. Absent for the last.
        overview:
          type: string
          description: A season's episode list only. The episode's synopsis, absent when it has none.

    ExtraInfo:
      type: object
      required: [type]
      properties:
        type: {$ref: "#/components/schemas/ExtraType"}
        parentId:
          $ref: "#/components/schemas/ID"
          description: The movie, series or season it belongs to.

    ExtraType:
      type: string
      description: What an extra is.
      enum: [trailer, featurette, behindTheScenes, deletedScene, interview, scene, short, other]

    CollectionSummary:
      type: object
      description: A movie collection or a videos library's folder, for its card.
      required: [id, name, workCount, images]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        name: {type: string}
        workCount:
          type: integer
          description: Its root works the user sees.
        source: {$ref: "#/components/schemas/CollectionSource"}
        images:
          $ref: "#/components/schemas/WorkImages"
          description: |
            Its poster: a movie collection's own, which its movies' metadata
            refreshes fetch, else the poster of its first root work the user sees
            that has one, in release order.

    Collection:
      type: object
      description: A collection's page.
      required: [id, name, images, items]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        name: {type: string}
        source: {$ref: "#/components/schemas/CollectionSource"}
        images:
          $ref: "#/components/schemas/WorkImages"
          description: Its poster, as `CollectionSummary.images` has it, and a movie collection's own backdrop.
        items:
          type: array
          description: Its root works the user sees, in release order.
          items: {$ref: "#/components/schemas/WorkSummary"}

    CollectionSummaryPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CollectionSummary"}
        total: {type: integer}

    CollectionSource:
      type: string
      description: |
        Where a collection comes from: `provider` a movie collection, `folder`
        a videos-library folder.
      enum: [provider, folder]

    BookInfo:
      type: object
      required: [authors, narrators, series]
      properties:
        authors:
          type: array
          description: In credit order; the first is the primary author.
          items: {$ref: "#/components/schemas/PersonRef"}
        narrators:
          type: array
          items: {$ref: "#/components/schemas/PersonRef"}
        series:
          type: array
          description: The series the book is in, the primary first.
          items: {$ref: "#/components/schemas/BookSeriesRef"}
        subtitle:
          type: string
          description: Detail only.
        publisher:
          type: string
          description: Detail only.
        language:
          type: string
          description: Detail only, as its source gives it.
        abridged:
          type: boolean
          description: Detail only; absent when unknown.
        releaseDate:
          type: string
          description: Detail only. `YYYY`, `YYYY-MM` or `YYYY-MM-DD`.

    SearchResults:
      type: object
      required: [works, people, collections]
      properties:
        works:
          type: array
          description: Works, best first.
          items: {$ref: "#/components/schemas/WorkSummary"}
        people:
          type: array
          description: People credited on a work the profile sees, best first.
          items: {$ref: "#/components/schemas/PersonSummary"}
        collections:
          type: array
          description: Collections holding a root work the profile sees, best first.
          items: {$ref: "#/components/schemas/CollectionSummary"}

    PersonSummary:
      type: object
      required: [id, name, role, workCount]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        name: {type: string}
        photo: {$ref: "#/components/schemas/ImageRef"}
        role:
          type: string
          description: The credit role they have on the most of the root works the profile sees, as `Credit.role`.
        workCount:
          type: integer
          description: |
            The movies, shows, videos and books the profile sees that
            they're credited on, an episode counting as its series; in a
            library's authors, the library's books they wrote.

    PersonSummaryPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PersonSummary"}
        total: {type: integer}
        letters:
          type: array
          description: On the first page (offset 0). See `LetterStart`.
          items: {$ref: "#/components/schemas/LetterStart"}

    PersonRef:
      type: object
      required: [id, name]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        name: {type: string}

    BookSeriesRef:
      type: object
      required: [id, name, primary]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        name: {type: string}
        position:
          type: string
          description: The book's position as written, such as `1`, `1.5` or `1-3`; absent for none.
        primary: {type: boolean}

    Person:
      type: object
      required: [id, name, works, bookSeries, standalone, narrated]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        name: {type: string}
        overview:
          type: string
          description: Their biography, from the book provider.
        photo: {$ref: "#/components/schemas/ImageRef"}
        works:
          type: array
          description: The movies, shows and videos they're credited on, or on an episode of, newest first.
          items: {$ref: "#/components/schemas/WorkSummary"}
        bookSeries:
          type: array
          description: The series of the books they wrote, by name, each with those books in series order.
          items: {$ref: "#/components/schemas/BookSeries"}
        standalone:
          type: array
          description: The books they wrote in no series, by title.
          items: {$ref: "#/components/schemas/WorkSummary"}
        narrated:
          type: array
          description: The books they narrated, by title.
          items: {$ref: "#/components/schemas/WorkSummary"}

    BookSeries:
      type: object
      required: [id, name, items]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        name: {type: string}
        items:
          type: array
          description: Books, by position, those with none last, then by title.
          items: {$ref: "#/components/schemas/WorkSummary"}

    BookSeriesSummary:
      type: object
      description: A book series, for its card.
      required: [id, name, bookCount]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        name: {type: string}
        bookCount:
          type: integer
          description: Its books in the library that the profile sees.
        cover:
          $ref: "#/components/schemas/ImageRef"
          description: Its first book's cover.

    BookSeriesSummaryPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/BookSeriesSummary"}
        total: {type: integer}
        letters:
          type: array
          description: On the first page (offset 0). See `LetterStart`.
          items: {$ref: "#/components/schemas/LetterStart"}

    BookSeriesUpdate:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        position:
          type: string
          description: As written, such as `1`, `1.5` or `1-3`.
        primary:
          type: boolean
          description: One series is primary; with none marked, the first.

    NameUpdate:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 500}

    WorksUpdate:
      type: object
      required: [workIds]
      properties:
        workIds:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: "#/components/schemas/ID"}
        authors:
          type: array
          description: Names in order, used as written.
          items: {type: string}
        narrators:
          type: array
          items: {type: string}
        genres:
          type: array
          items: {type: string}
        series:
          type: object
          required: [name]
          properties:
            name:
              type: string
              description: Empty takes the books out of every series.
            keepPosition:
              type: boolean
              description: Keep each book's position in its primary series; otherwise it has none. Default false.

    WorkSummaryPage:
      type: object
      description: A page of a grid of works.
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/WorkSummary"}
        total: {type: integer}
        letters:
          type: array
          description: On the first page (offset 0) of the title sort. See `LetterStart`.
          items: {$ref: "#/components/schemas/LetterStart"}

    WorkSummaryFeed:
      type: object
      description: A page of a feed of works.
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/WorkSummary"}
        next:
          type: string
          description: The cursor of the page after this one; absent on the last.

    WorkSummaryList:
      type: object
      description: A whole list of works.
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/WorkSummary"}

    LetterStart:
      type: object
      description: |
        Where a letter of a grid's letter rail starts, in the grid's order.
        A work files under the first character of its sort title, so
        leading articles are skipped, and a person or series under the
        first character of their sort name: `A` to `Z`, or `#` for digits
        and anything else. A letter is listed once, at its first item;
        letters without items are left out.
      required: [letter, offset]
      properties:
        letter: {type: string, description: "`A` to `Z`, or `#`."}
        offset: {type: integer, description: The index of the letter's first item in the grid.}

    WorkDetail:
      description: |
        The detail page: the summary's fields plus the rest. Fields marked
        "detail only" in the kind objects are set here.
      allOf:
        - {$ref: "#/components/schemas/WorkSummary"}
        - type: object
          required: [genres, studios, credits, externalIds, versions, extras, collections]
          properties:
            originalTitle: {type: string}
            sortTitle: {type: string}
            overview: {type: string}
            genres:
              type: array
              items: {type: string}
            studios:
              type: array
              items: {type: string}
            credits:
              type: array
              items: {$ref: "#/components/schemas/Credit"}
            externalIds:
              type: array
              items: {$ref: "#/components/schemas/ExternalId"}
            versions:
              type: array
              description: |
                Playable versions in libraries the user can see. A version
                with a missing file isn't listed, and is again if the file
                returns within 30 days. Untagged versions come first, then
                each edition by label, ignoring case; within an edition, the
                taller picture comes first, then the larger size. A play
                that names no version plays the one the user last played
                (`UserState.versionId`) while it's listed here, else the
                first. Empty for series and seasons.
              items: {$ref: "#/components/schemas/Version"}
            remembersTracks:
              type: boolean
              description: |
                With versions: whether choosing tracks for this work
                remembers them for its series, as for an episode when the
                user's `rememberTracks` is on (`PlaybackPreferences`).
            extras:
              type: array
              description: Extras, as summaries of kind `extra`.
              items: {$ref: "#/components/schemas/WorkSummary"}
            collections:
              type: array
              description: Collections this work is in.
              items: {$ref: "#/components/schemas/CollectionSummary"}
            lockedFields:
              type: array
              description: Admins only. Fields an admin edited, shown with a lock icon.
              items: {type: string}

    WorkUpdate:
      type: object
      description: Only the fields sent change, and each is locked.
      properties:
        title: {type: string, minLength: 1}
        sortTitle: {type: string, minLength: 1}
        originalTitle: {type: string}
        year: {type: integer}
        overview: {type: string}
        contentRating:
          type: string
          description: |
            One of `listContentRatings`' names, which also sets the age it
            means, or empty for unrated.
        genres:
          type: array
          items: {type: string}
        studios:
          type: array
          items: {type: string}
        episode:
          type: object
          properties:
            airDate: {type: string, format: date}
        book:
          type: object
          description: |
            A book's own fields. Its description is `overview`. Their locked
            field names are `book.` and the field's name.
          properties:
            subtitle: {type: string}
            publisher: {type: string}
            releaseDate:
              type: string
              description: '`YYYY`, `YYYY-MM` or `YYYY-MM-DD`, or empty; sets the year too.'
              pattern: '^(\d{4}(-\d{2}(-\d{2})?)?)?$'
            asin: {type: string, maxLength: 20}
            authors:
              type: array
              description: Names in order, used as written; the first is the primary author.
              items: {type: string}
            narrators:
              type: array
              items: {type: string}
            series:
              type: array
              description: The book's series, replacing those it has. A name is the oldest series of that name, else a new one.
              items: {$ref: "#/components/schemas/BookSeriesUpdate"}
        series:
          type: object
          properties:
            ordering:
              type: string
              description: |
                Documented values `aired`, `dvd`, `absolute`, `group:<ID>`,
                where the ID is one of the series' TMDb episode groups (field
                code `unknownEpisodeGroup` otherwise). An ordering TMDb can't
                resolve when episodes are placed, such as DVD for a series
                with no DVD order, places them in aired order. Not a locked
                field.

    Credit:
      type: object
      required: [personId, name, role]
      properties:
        personId: {$ref: "#/components/schemas/ID"}
        name: {type: string}
        role:
          type: string
          description: Free text, such as `actor`, `director`, `writer`; a book's are `author` and `narrator`.
        character: {type: string}
        photo: {$ref: "#/components/schemas/ImageRef"}

    ExternalId:
      type: object
      required: [provider, kind, id]
      properties:
        provider: {$ref: "#/components/schemas/ExternalProvider"}
        kind:
          type: string
          description: The provider's kind, such as `movie`, `series`, `episode`.
        id: {type: string}

    ExternalProvider:
      type: string
      description: A metadata provider an ID is from; `audible` is a book's ASIN.
      enum: [tmdb, tvdb, imdb, anidb, audible]

    Version:
      type: object
      description: One playable copy of a work. Its tracks are its first part's.
      required: [id, available, durationMs, sizeBytes, parts, tracks, workIds]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        edition:
          type: string
          description: |
            The cut its files' edition tag names, such as `Final Cut`;
            absent for an untagged version.
        resolution:
          $ref: "#/components/schemas/Resolution"
          description: Its video's resolution class; absent without video.
        hdr:
          $ref: "#/components/schemas/HdrFormat"
          description: Its video's HDR format; absent for SDR or without video.
        available:
          type: boolean
          description: False when a part's folder is unreachable.
        libraryId: {$ref: "#/components/schemas/ID"}
        container: {type: string}
        durationMs: {type: integer}
        sizeBytes: {type: integer, format: int64}
        bitrateBps: {type: integer, format: int64}
        parts:
          type: array
          items: {$ref: "#/components/schemas/VersionPart"}
        tracks:
          type: array
          items: {$ref: "#/components/schemas/Track"}
        audioTrackId:
          $ref: "#/components/schemas/ID"
          description: |
            The audio track the caller's play of this version starts with
            when the request chooses none (`PlayCreate`); absent when the
            version has no audio.
        subtitleTrackId:
          $ref: "#/components/schemas/ID"
          description: |
            The subtitle track the caller's play of this version starts
            with when the request chooses none (`PlayCreate`); absent when
            subtitles start off.
        workIds:
          type: array
          description: The works this version covers, in order; more than one for a multi-episode file.
          items: {$ref: "#/components/schemas/ID"}
        chapterCount:
          type: integer
          description: |
            Chapters on the version's timeline: each part's own, and for a
            part of several with none, the part itself, as a book of
            per-chapter files has them. A part's chapters are left out
            unless they are in order, don't overlap and fit in its file.
        chapters:
          type: array
          description: |
            A book's chapters on the version's timeline, as a play lists
            them, for its page to list and start playback at; absent
            for other kinds.
          items: {$ref: "#/components/schemas/Chapter"}
        markers:
          type: array
          description: |
            An episode's or a movie's markers on the version's timeline, as a
            play of it has them; absent for other kinds.
          items: {$ref: "#/components/schemas/Marker"}

    VersionPart:
      type: object
      required: [fileId, name, durationMs, sizeBytes]
      properties:
        fileId: {$ref: "#/components/schemas/ID"}
        name:
          type: string
          description: The file's name.
        durationMs: {type: integer}
        sizeBytes: {type: integer, format: int64}

    Track:
      type: object
      description: An audio, video or subtitle track. Kind-specific data is under its type's name.
      required: [id, type, codec, default]
      properties:
        id:
          $ref: "#/components/schemas/ID"
          description: |
            The track's ID; chooses it in a play request. An embedded track
            keeps its ID while its file is unchanged, and a subtitle file
            keeps its own while it stays at its path, so adding or removing
            one never changes another track's ID.
        type: {$ref: "#/components/schemas/TrackType"}
        codec: {type: string}
        language:
          type: string
          description: A BCP 47 tag.
        title:
          type: string
          description: |
            The track's title as the file gives it, such as "Commentary by the
            director" or "Signs & Songs"; for a `downloaded` subtitle, the release
            OpenSubtitles says it was made for, such as
            `Modern.Family.S03E16.480p.BluRay.x264-mSD`.
        default: {type: boolean}
        forced:
          type: boolean
          description: Subtitles only, marked as forced (they show only lines in another language than the audio); absent when not.
        hearingImpaired:
          type: boolean
          description: Marked as for the deaf and hard of hearing (SDH); absent when not.
        commentary:
          type: boolean
          description: Marked as commentary, or titled with the word; absent when not.
        original:
          type: boolean
          description: |
            Audio only: in the work's original language, as the metadata
            provider gives it, where the work also has audio in another
            language; never a commentary. Absent when not.
        video: {$ref: "#/components/schemas/VideoTrackInfo"}
        audio: {$ref: "#/components/schemas/AudioTrackInfo"}
        subtitle: {$ref: "#/components/schemas/SubtitleTrackInfo"}

    TrackType:
      type: string
      description: A track's type.
      enum: [video, audio, subtitle]

    VideoTrackInfo:
      type: object
      required: [width, height]
      properties:
        width: {type: integer}
        height: {type: integer}
        resolution: {$ref: "#/components/schemas/Resolution"}
        frameRate: {type: number}
        profile:
          type: string
          description: As the codec names it, such as "Main 10".
        hdr:
          $ref: "#/components/schemas/HdrFormat"
          description: Its HDR format, `hdr10`, `hlg` or `dolbyVision`; absent for SDR. An HDR10+ video's is `hdr10`.

    Resolution:
      type: string
      description: |
        A video's resolution class, by its width, since wide films are short:
        `4k` from 3200 pixels, `1080p` from 1700, `720p` from 1200, else `sd`.
        The library's resolution filter classes videos the same way.
      enum: [4k, 1080p, 720p, sd]

    DynamicRange:
      type: string
      description: |
        A class of high dynamic range, as the library's `dynamicRange`
        filter and its facets name it: `hdr` any HDR format but Dolby
        Vision (`hdr10`, `hdr10plus`, `hlg`), `dolbyVision` Dolby Vision.
      enum: [hdr, dolbyVision]

    HdrFormat:
      type: string
      description: |
        A high dynamic range format. A video's is one of `hdr10`, `hlg` and
        `dolbyVision`; a client lists the formats it shows, `hdr10`,
        `hdr10plus` and `hlg`, with Dolby Vision's profiles apart.
      enum: [hdr10, hdr10plus, hlg, dolbyVision]

    AudioTrackInfo:
      type: object
      required: [channels]
      properties:
        channels: {type: integer}
        layout:
          type: string
          description: |
            The channel layout as main and LFE channels, such as "2.0",
            "4.0", "5.1" or "7.1"; absent when the file doesn't say.
        profile: {$ref: "#/components/schemas/AudioProfile"}

    AudioProfile:
      type: string
      description: |
        What the audio's profile says beyond its codec: `atmos` for Dolby
        Atmos on TrueHD or E-AC-3, `dtsX`, `dtsHdMa` or `dtsHdHra` for DTS;
        absent for any other.
      enum: [atmos, dtsX, dtsHdMa, dtsHdHra]

    SubtitleTrackInfo:
      type: object
      required: [source]
      properties:
        source: {$ref: "#/components/schemas/SubtitleSource"}

    SubtitleSource:
      type: string
      description: |
        Where a subtitle lives: `embedded` in the media, `external` a
        subtitle file next to the video in the library, `downloaded` from
        OpenSubtitles. How a play delivers it is the track's delivery, where
        `external` means a subtitle sent to the client as its own file.
      enum: [embedded, external, downloaded]

    Chapter:
      type: object
      required: [startMs, endMs]
      properties:
        startMs: {type: integer}
        endMs: {type: integer}
        title: {type: string}

    Marker:
      type: object
      description: |
        A part of a video's timeline a player offers to skip. An episode
        has intro, recap and credits markers, a movie credits only, any
        other video none. Each kind comes from an admin's marker, else,
        for an episode, what the server found in its season's audio and
        pictures, else the file's own chapters (a chapter whose whole name
        is the marker's: Intro, Opening Credits, OP; Recap, Previously On;
        Credits, End Credits, ED, where it belongs and as long as one
        lasts).
      required: [kind, startMs, endMs, source]
      properties:
        kind: {$ref: "#/components/schemas/MarkerKind"}
        startMs: {type: integer}
        endMs: {type: integer}
        source: {$ref: "#/components/schemas/MarkerSource"}
        final:
          type: boolean
          description: |
            Set on final credits: nothing follows them to the video's
            end but, perhaps, a next episode's preview, so up next may
            appear at their start.

    MarkerKind:
      type: string
      description: What a marker skips. A later server may add kinds; skip a marker of a kind you don't know.
      enum: [intro, recap, credits]

    MarkerSource:
      type: string
      description: |
        Where a marker comes from: the file's chapters, the audio its
        episode shares with others in its season (and, for credits, its
        pictures), or an admin. A later server may add sources.
      enum: [chapter, fingerprint, manual]

    Match:
      type: object
      required: [id, provider, kind, title]
      properties:
        id:
          type: string
          description: Opaque; pass it to `matchWork`.
        provider: {$ref: "#/components/schemas/ExternalProvider"}
        kind: {$ref: "#/components/schemas/MatchKind"}
        title: {type: string}
        originalTitle: {type: string}
        year: {type: integer}
        overview: {type: string}
        score:
          type: integer
          description: 0 to 100; 80 or more is accepted automatically.
        subtitle:
          type: string
          description: Books.
        authors:
          type: array
          description: Books.
          items: {type: string}
        narrators:
          type: array
          description: Books.
          items: {type: string}
        durationMs:
          type: integer
          description: Books, the running time.

    MatchKind:
      type: string
      description: What a match is.
      enum: [movie, series, book]

    MatchList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Match"}

    SubtitleResult:
      type: object
      required: [id, language, downloads, hashMatch, forced, hearingImpaired]
      properties:
        id:
          type: string
          description: Opaque; pass it to `addFileSubtitle`.
        language:
          type: string
          description: A BCP 47 tag.
        release:
          type: string
          description: The release it was made for, such as `Dune.2021.2160p.UHD.BluRay`.
        downloads: {type: integer}
        hashMatch:
          type: boolean
          description: Made for this exact file.
        forced:
          type: boolean
          description: Foreign parts only.
        hearingImpaired: {type: boolean}

    SubtitleResultList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/SubtitleResult"}

    FileSubtitleAdd:
      type: object
      required: [resultId]
      properties:
        resultId:
          type: string
          minLength: 1
          description: A subtitle result's `id`, from `listFileSubtitleResults`.

    FixMatchRequest:
      type: object
      required: [matchId]
      properties:
        matchId:
          type: string
          description: From `listWorkMatches`.

    Artwork:
      type: object
      required: [id, type, source, selected, image]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        type: {$ref: "#/components/schemas/ArtworkType"}
        source: {$ref: "#/components/schemas/ArtworkSource"}
        provider:
          $ref: "#/components/schemas/ArtworkProvider"
          description: For `provider`, which one.
        language:
          type: string
          description: The text's language (ISO 639-1); absent for textless or unknown.
        width:
          type: integer
          description: The original's width in pixels, when known.
        height:
          type: integer
          description: The original's height in pixels, when known.
        selected: {type: boolean}
        image: {$ref: "#/components/schemas/ImageRef"}

    ArtworkType:
      type: string
      description: An image's role.
      enum: [poster, backdrop, logo, still]

    ArtworkSource:
      type: string
      description: |
        Where an image comes from: a metadata provider, the media's folder, or
        an admin's upload.
      enum: [provider, local, upload]

    ArtworkProvider:
      type: string
      description: The provider an image comes from.
      enum: [tmdb]

    ArtworkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Artwork"}

    ArtworkUpload:
      type: object
      required: [type, file]
      properties:
        type: {$ref: "#/components/schemas/ArtworkType"}
        file:
          type: string
          format: binary
          description: JPEG, PNG or WebP, up to 25 MB and 40 megapixels.

    MediaFile:
      type: object
      required: [id, libraryId, path, sizeBytes, modifiedAt, status, tracks]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        libraryId: {$ref: "#/components/schemas/ID"}
        path:
          type: string
          description: Absolute, as last seen.
        sizeBytes: {type: integer, format: int64}
        modifiedAt: {type: string, format: date-time}
        status: {$ref: "#/components/schemas/MediaFileStatus"}
        goneAt:
          type: string
          format: date-time
          description: For `gone`; purged 30 days later.
        versionId: {$ref: "#/components/schemas/ID"}
        part:
          type: integer
          description: Its part in the version, from 0.
        title:
          type: string
          description: The title of the first work its version covers, `workId`.
        workId: {$ref: "#/components/schemas/ID"}
        container: {type: string}
        durationMs: {type: integer}
        bitrateBps: {type: integer, format: int64}
        tracks:
          type: array
          items: {$ref: "#/components/schemas/Track"}

    MediaFileStatus:
      type: string
      description: Whether a file was there when last looked for.
      enum: [present, gone]

    MediaFileFeed:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/MediaFile"}
        next: {type: string}
        total: {type: integer}

    MediaFileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/MediaFile"}

    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Task"}

    Task:
      type: object
      description: |
        A row of the Tasks page: "Preview thumbnails · 8 h ago · Nightly ·
        14,486 of 32,975 · 2 failed".
      required: [id, section, nightly, pendingCount, running, stoppable]
      properties:
        id: {$ref: "#/components/schemas/TaskName"}
        section: {$ref: "#/components/schemas/TaskSection"}
        lastRun: {$ref: "#/components/schemas/TaskRun"}
        nightly:
          type: boolean
          description: Its runs begin as the maintenance window opens; else every so often.
        nextRunAt:
          type: string
          format: date-time
          description: |
            When its next run begins. Absent in `activity`, and for a task
            whose work every library is set to never do, such as refreshing
            metadata, preview thumbnails or intro and credits.
        progress: {$ref: "#/components/schemas/TaskProgress"}
        pendingCount:
          type: integer
          description: What's left for its next run, while no run of it works; 0 otherwise.
        failedCount:
          type: integer
          description: |
            Its items that failed for good (`GET
            /api/v1/tasks/{task}/failures`). Absent for a task that keeps no
            failures.
        running:
          type: boolean
          description: It has items in flight or asked for, or a run working.
        stoppable:
          type: boolean
          description: |
            Stop applies (`POST /api/v1/tasks/{task}/stop`): it's running,
            and isn't work that always finishes, such as downloads and
            library changes.

    TaskName:
      type: string
      description: A task's name. Skip tasks you don't know.
      enum: [scan-libraries, prune-gone-files, refresh-metadata, prune-provider-cache, make-previews,
        prune-previews, find-markers, prune-markers, extract-subtitles, prune-subtitles,
        prepare-downloads, prune-downloads, library-changes, prune-activity, make-backup, optimize-database]

    TaskSection:
      type: string
      description: |
        The Tasks page's table a row is in: `activity`, work done as it's
        asked for; `library`, the scheduled tasks on the libraries' media;
        `maintenance`, the cleanups and the database's tasks. Skip sections
        you don't know.
      enum: [activity, library, maintenance]

    TaskRun:
      type: object
      description: How a task's last run ended.
      required: [finishedAt]
      properties:
        finishedAt: {type: string, format: date-time}
        summary:
          type: string
          description: What it did, or that it was stopped.
        error:
          type: string
          description: Why it failed, in words for an admin.

    TaskProgress:
      type: object
      description: |
        How far a task has got, present while it's running: the items its
        run has done, of those and the ones left; else what its item in
        flight reported. Items asked for outside a run have no count here.
        `total` is 0 without a count.
      required: [done, total]
      properties:
        step:
          $ref: "#/components/schemas/TaskStep"
          description: The step of the first item in flight.
        done: {type: integer}
        total: {type: integer}

    TaskStep:
      type: string
      description: |
        A step of a task's item in flight: a library scan's (see ScanStep),
        `extractSubtitles`, a download's file having its subtitles
        extracted, or `convert`, a download being converted. Skip steps you
        don't know.
      enum: [walk, probe, identify, extractSubtitles, convert]

    TaskRetry:
      type: object
      properties:
        itemIds:
          type: array
          description: The items to retry; every failed one when absent.
          items: {$ref: "#/components/schemas/ID"}

    TaskFailureList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/TaskFailure"}

    TaskFailure:
      type: object
      description: An item a task failed for good.
      required: [itemId, reason, failedAt]
      properties:
        itemId:
          $ref: "#/components/schemas/ID"
          description: What it is, such as a file or a work.
        title:
          type: string
          description: |
            Its name: the item a file plays (its path within its library
            folder until it's matched), or a work's title, with its series
            and "S1 · E2" for an episode.
        reason:
          type: string
          description: Why it failed, in words for an admin.
        failedAt: {type: string, format: date-time}

    ServerProblem:
      type: object
      description: An open issue on the problems page, such as "library /mnt/tv unreachable for 2 h".
      required: [id, component, code, message, severity, raisedAt]
      properties:
        id:
          type: string
          description: Opaque and stable while the problem is open.
        component:
          type: string
          description: The reporting part of the server, such as `scan`.
        code:
          type: string
          description: Stable, for translating and choosing the fix action, such as `folderUnreachable`.
        message:
          type: string
          description: English, written for an admin; shown when the client has no translation for `code`.
        severity: {$ref: "#/components/schemas/ProblemSeverity"}
        raisedAt: {type: string, format: date-time}

    ProblemSeverity:
      type: string
      description: How much a server problem matters.
      enum: [info, warning, error]

    ServerProblemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ServerProblem"}

    LogLine:
      type: object
      description: One line of the server's log.
      required: [id, loggedAt, level, message, attributes]
      properties:
        id:
          type: string
          description: Opaque; later lines sort after it. Pass it as `after` for the lines since.
        loggedAt: {type: string, format: date-time}
        level: {$ref: "#/components/schemas/LogLevel"}
        message:
          type: string
          description: 'English, as `component: what happened`, such as `scan: finished`.'
        attributes:
          type: array
          description: The line's attributes, in order. A group's keys are dotted, such as `seen.files`.
          items: {$ref: "#/components/schemas/LogAttr"}

    ClientErrorReport:
      type: object
      description: One uncaught error in a client, as `POST /api/v1/client-errors` takes it. Fields it doesn't name are ignored.
      required: [kind, message]
      properties:
        kind:
          $ref: "#/components/schemas/ClientErrorKind"
        message:
          type: string
          description: The error's message; the server keeps the first 500 characters.
        stack:
          type: array
          description: The top frames of its stack, one a line; the server keeps the first 10, each cut to 300 characters.
          items: {type: string}
        route:
          type: string
          description: |
            The route's template, such as `/works/$id`, never the URL: no
            IDs, query or hash. The server keeps up to 200 characters of
            letters, digits and `/_$.-`, and drops anything else.
        version:
          type: string
          description: The client's build version; up to 64 characters.
        engine:
          $ref: "#/components/schemas/ClientEngine"

    ClientErrorKind:
      type: string
      description: |
        What caught it: an uncaught error, an unhandled promise rejection,
        a route's render failing, or a code chunk failing to load.
      enum: [error, unhandledRejection, render, chunk]

    ClientEngine:
      type: object
      description: The client's engine, read from its user agent; each field up to 32 characters. Fields it doesn't name are ignored.
      properties:
        platform:
          type: string
          description: The platform, such as tizen, webos or browser.
        tizenVersion:
          type: string
          description: Tizen's version, such as 8.0, on a Samsung TV.
        chromiumVersion:
          type: string
          description: Chromium's major version, such as 108.

    LogLevel:
      type: string
      description: A log line's level.
      enum: [debug, info, warning, error]

    LogAttr:
      type: object
      required: [key, value]
      properties:
        key: {type: string}
        value:
          type: string
          description: The value as the text log writes it, such as `1.5s` or `/mnt/movies`.

    LogLineFeed:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/LogLine"}
        next: {type: string}
        total: {type: integer}

    PlayCreate:
      type: object
      required: [workId, capabilities]
      properties:
        workId: {$ref: "#/components/schemas/ID"}
        versionId:
          $ref: "#/components/schemas/ID"
          description: |
            Play this version. Default the version a chosen audio or
            subtitle track belongs to; else the version the user last
            played (`UserState.versionId`), while the work's `versions`
            list it; else the first of them.
        positionMs:
          type: integer
          description: |
            Where to start on the version's timeline. Default the resume
            position, or the beginning when the version is of another
            edition than the one the position is on.
        audioTrackId:
          $ref: "#/components/schemas/ID"
          description: |
            An audio track's `id`. Default: for an episode, the language
            last chosen for its series; else the user's audio language,
            if the version has it; else the version's default track.
            Choosing a track for an episode remembers its language for the
            series. Series memory applies when the user's
            `rememberTracks` is on (`PlaybackPreferences`).
        subtitleTrackId:
          type: string
          maxLength: 36
          description: |
            A subtitle track's `id`, or `off`. Default: for an episode,
            the language and kind (forced, SDH, full or off) last chosen for
            its series; else by the user's subtitle mode and language
            (`PlaybackPreferences`).
        capabilities: {$ref: "#/components/schemas/Capabilities"}
        settings: {$ref: "#/components/schemas/PlaybackSettings"}
        dialogueBoost:
          type: boolean
          description: |
            Boost dialogue: the audio is encoded to AAC with the centre
            channel raised and loud passages compressed, and the video is
            copied. Default false. A play that can't boost its dialogue
            ignores it; `PlayStarted.dialogueBoost` says what the play does.

    Capabilities:
      type: object
      description: |
        What this client plays, measured where it runs and corrected for
        its platform's known misreports. Facts only: choices the user makes
        go in `PlaybackSettings`. Sent with every play; nothing is stored
        per client.

        Each list holds entries, and a track plays when any entry for its
        delivery matches it: entries are alternatives, and every field of
        an entry must hold. An absent field is no limit. Codec names are
        ffmpeg's `codec_name`, as `Track.codec` gives them. The server
        ignores fields and enum values it doesn't know rather than
        refusing the request, and drops an entry left with no delivery.
      required: [video, audio, subtitles]
      properties:
        file:
          $ref: "#/components/schemas/FileCapabilities"
          description: Files it plays whole, the original or a download. Absent, it plays none.
        video:
          type: array
          items: {$ref: "#/components/schemas/VideoEntry"}
        audio:
          type: array
          items: {$ref: "#/components/schemas/AudioEntry"}
        subtitles:
          type: array
          items: {$ref: "#/components/schemas/SubtitleEntry"}

    FileCapabilities:
      type: object
      description: How a client plays a whole file.
      required: [containers]
      properties:
        containers:
          type: array
          description: Containers it plays, such as `mkv`, `mp4`, `webm`, `ts`, `m2ts`, `mov`, `m4a`, `mp3`, `flac`, `ogg`.
          items: {type: string}
        trackSelection:
          type: boolean
          description: |
            It plays any audio track inside a file, not only the default
            one, so choosing another audio track keeps the file. Default
            false.

    CapabilityDelivery:
      type: string
      description: |
        How a track reaches the client: `file` inside the played file;
        `stream` inside the HLS stream (fragmented MP4, and WebVTT
        subtitle renditions); `external` a subtitle sent to the client as
        its own file, which the client draws. A track's source, also
        `external` for a subtitle file next to the video, is where it lives,
        not how it's delivered.
      enum: [file, stream, external]

    VideoEntry:
      type: object
      description: One kind of video the client decodes.
      required: [codec, delivery]
      properties:
        codec:
          type: string
          description: Such as `h264`, `hevc`, `av1`, `vp9`, `mpeg2video`, `vc1`.
        delivery:
          type: array
          description: Where it decodes it, `file` or `stream`.
          items: {$ref: "#/components/schemas/CapabilityDelivery"}
        containers:
          type: array
          description: For `file`, the containers it decodes this in; other containers don't match the entry.
          items: {type: string}
        tags:
          type: array
          description: For `file`, the codec tags it takes, such as `hvc1`, `hev1`, `dvh1`, `dvhe`.
          items: {type: string}
        profiles:
          type: array
          description: Profiles as ffprobe prints them, such as `High`, `Main 10`, `Profile 2`.
          items: {type: string}
        maxLevel:
          type: number
          format: double
          description: The highest level, as the codec's specification writes it, such as 4.1 or 5.1.
        maxBitDepth: {type: integer}
        maxWidth: {type: integer}
        maxHeight: {type: integer}
        maxFrameRate: {type: number, format: double}
        maxBitrateBps:
          type: integer
          format: int64
          description: The decoder's limit in bits per second. A quality the user picks goes in `settings` instead.
        maxRefFrames: {type: integer}
        interlaced:
          type: boolean
          description: Whether it plays interlaced video. Default true.
        anamorphic:
          type: boolean
          description: Whether it plays video with non-square pixels. Default true.
        hdr:
          type: array
          description: The HDR formats it shows, of `hdr10`, `hdr10plus` and `hlg`; SDR always plays. An HDR10+ video matches `hdr10`.
          items: {$ref: "#/components/schemas/HdrFormat"}
        dolbyVision:
          type: array
          description: The Dolby Vision profiles it shows.
          items: {$ref: "#/components/schemas/DolbyVisionEntry"}
        doviFallback:
          type: boolean
          description: |
            Play a Dolby Vision video whose profile isn't listed by its base
            layer, when that layer matches `hdr`: profile 8.1 and 7 are
            HDR10, 8.4 is HLG, 8.2 is SDR, and 10 is what its compatibility
            ID says. Default false.


    DolbyVisionEntry:
      type: object
      description: |
        A Dolby Vision profile a client shows. A video matches when its
        profile is listed, with its base layer's compatibility ID among
        `compat` when that's given.
      required: [profile]
      properties:
        profile:
          type: integer
          description: The profile, 5, 7, 8 or 10.
        compat:
          type: array
          description: The base layer compatibility IDs it shows, such as 1, 2, 4.
          items: {type: integer}
        el:
          type: boolean
          description: Whether it plays a video with an enhancement layer. Absent means it does.

    AudioEntry:
      type: object
      description: One kind of audio the client plays.
      required: [codec, delivery, maxChannels]
      properties:
        codec:
          type: string
          description: Such as `aac`, `ac3`, `eac3`, `truehd`, `dts`, `flac`, `opus`, `mp3`, `alac`.
        delivery:
          type: array
          description: Where it plays it, `file` or `stream`.
          items: {$ref: "#/components/schemas/CapabilityDelivery"}
        containers:
          type: array
          description: For `file`, the containers it plays this in.
          items: {type: string}
        maxChannels:
          type: integer
          description: >-
            The most channels that reach the output: decoded on the device,
            no more than its speakers or its own setting; passed through, as
            many as the receiver takes. Audio with more channels is
            transcoded to AAC with as many as the client's AAC entry allows,
            at most 6; to stereo it's mixed keeping dialogue clear.
        maxSampleRate: {type: integer}
        maxBitDepth: {type: integer}
        profiles:
          type: array
          description: Profiles as ffprobe prints them, such as `LC`, `HE-AAC`, `Dolby TrueHD + Dolby Atmos`.
          items: {type: string}

    SubtitleEntry:
      type: object
      description: |
        A subtitle codec a client shows, and how. The server converts a
        text subtitle to a text codec listed for a delivery. In the stream
        that's always WebVTT, the only text HLS carries. As an external
        file it's WebVTT too, where `webvtt` is listed, converted from
        SubRip, WebVTT, mov_text or ASS as plain text, with styling beyond
        italics, bold and underline dropped.
        An ASS track stays ASS for a client that lists `ass`, and an
        embedded one is burned in for a client that doesn't. Image
        subtitles are never converted; a client that can't show one has it
        burned in.
      required: [codec, delivery]
      properties:
        codec:
          type: string
          description: Such as `webvtt`, `subrip`, `ass`, `mov_text`, `hdmv_pgs_subtitle`, `dvd_subtitle`.
        delivery:
          type: array
          description: |
            `file` read from the played file, `stream` a WebVTT rendition of
            the HLS stream, `external` its own file. In picture-in-picture
            or on AirPlay a client leaves out `external`.
          items: {$ref: "#/components/schemas/CapabilityDelivery"}
        containers:
          type: array
          description: For `file`, the containers it reads this from; other containers don't match the entry.
          items: {type: string}

    PlaybackSettings:
      type: object
      description: The client's playback settings, kept on the client.
      properties:
        localQuality:
          $ref: "#/components/schemas/QualityRequest"
          description: The client's quality on the server's local networks.
        remoteQuality:
          $ref: "#/components/schemas/QualityRequest"
          description: The client's quality anywhere else, used instead of `localQuality` when the server counts the client as remote.
        directPlay:
          type: boolean
          description: Play files directly. Default true.
        burnSubtitles:
          type: boolean
          description: Always burn in subtitles. Default false.

    QualityRequest:
      type: object
      description: A quality the user picked, or a play applies. Absent means `auto`.
      required: [mode]
      properties:
        mode: {$ref: "#/components/schemas/QualityMode"}
        maxBitrateBps:
          type: integer
          format: int64
          description: For `limit`, from the fixed ladder.
        bandwidthBps:
          type: integer
          format: int64
          description: For `auto`, the client's last measured download rate from this server; the play stays below about 80% of it.

    QualityMode:
      type: string
      description: |
        A quality pick: `auto` chosen from limits and measured bandwidth,
        `original` with no cap, `limit` capped at `maxBitrateBps`.
      enum: [auto, original, limit]

    PlayStarted:
      type: object
      description: |
        A play that started, and where to fetch its media. Media URLs are
        relative to the API root (`/api/v1/`) and carry the play's ID, which
        is a credential: treat them like a token.

        `tracks` says how every choice shows. A choice without a `delivery`
        starts a new play at the current position with that track. Any
        other shows as its delivery says, and a subtitle shown so is
        reported in the heartbeat (`PlayUpdate.subtitleTrackId`), as is an
        audio track chosen inside the file. Players show the play as
        Direct Play when the video's delivery is `file`, Direct Stream when
        it's `stream` without `transcode`, and Transcode with `transcode`.
      required: [id, workId, versionId, startMs, durationMs, local, delivery, url, tracks, parts, chapters]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        workId: {$ref: "#/components/schemas/ID"}
        versionId: {$ref: "#/components/schemas/ID"}
        startMs:
          type: integer
          description: Where playback starts on the version's timeline. Seek here once metadata has loaded (Safari ignores an earlier seek).
        durationMs: {type: integer}
        local:
          type: boolean
          description: Whether the client is on a local network.
        bitrateBps:
          type: integer
          format: int64
          description: The stream's bitrate, a video transcode's target or else the source's, when known.
        limitBps:
          type: integer
          format: int64
          description: |
            The bitrate cap the server sets on the play whatever quality the
            client picks, when one applies. A quality above it can't be
            chosen.
        delivery: {$ref: "#/components/schemas/PlayDelivery"}
        url:
          type: string
          description: For `file`, the first part; for `stream`, the multivariant playlist.
        tracks:
          type: array
          description: Every track of the version, and the subtitle choice `off`.
          items: {$ref: "#/components/schemas/PlayTrack"}
        parts:
          type: array
          description: The version's parts in order; positions are on their joined timeline.
          items: {$ref: "#/components/schemas/PlayPart"}
        previews: {$ref: "#/components/schemas/PreviewsDelivery"}
        chapters:
          type: array
          items: {$ref: "#/components/schemas/Chapter"}
        markers:
          type: array
          description: The version's markers on its timeline, in order.
          items: {$ref: "#/components/schemas/Marker"}
        quality:
          $ref: "#/components/schemas/QualityRequest"
          description: |
            The quality the play applies: the request's `settings.quality`,
            or its `settings.remoteQuality` when the server counts the client
            as remote. Absent means `auto`.
        dialogueBoost:
          $ref: "#/components/schemas/DialogueBoost"
          description: |
            The play's dialogue boost. Absent when the play can't boost its
            dialogue: one without video or audio, or on a client without
            HLS. Switching it starts a new play at the same position.

    PlayDelivery:
      type: string
      description: |
        How a play's media is fetched: `file` is the original, each part's
        `url` with range requests; `stream` is the HLS playlist at `url`.
      enum: [file, stream]

    PlayTrack:
      type: object
      description: |
        One choice of a play: a track of its version, or the subtitle choice
        `off`, and how it shows.
      required: [trackId, type]
      properties:
        trackId:
          type: string
          maxLength: 36
          description: A track's `id`, or `off`.
        type: {$ref: "#/components/schemas/TrackType"}
        selected:
          type: boolean
          description: True for the tracks the play shows; absent otherwise.
        delivery:
          $ref: "#/components/schemas/TrackDelivery"
          description: Absent when choosing it starts a new play.
        codec:
          type: string
          description: The codec it's delivered as, such as `hevc`, `aac` or `webvtt`.
        hdr:
          $ref: "#/components/schemas/HdrFormat"
          description: The video's HDR as delivered; absent for SDR.
        transcode: {$ref: "#/components/schemas/TrackTranscode"}
        reason:
          $ref: "#/components/schemas/TrackReason"
          description: Why the track isn't delivered unchanged in the file, or why choosing it starts a new play, when there's a reason to give.
        mismatch: {$ref: "#/components/schemas/CapabilityMismatch"}
        index:
          type: integer
          description: For `file`, the track's stream index, to select it in the player.
        url:
          type: string
          description: For `external`, the file, relative to the API root.
        fonts:
          type: array
          description: |
            For an `ass` subtitle delivered `external`, the URLs of the
            fonts it uses, each once, relative to the API root:
            `GET /api/v1/fonts/{sha256}`, cacheable for good. Load them
            before drawing.
          items: {type: string}

    TrackDelivery:
      type: string
      description: |
        How a choice shows: `file` inside the played file, selected by
        `index`; `stream` in the HLS stream, a subtitle as the rendition
        whose `STABLE-RENDITION-ID` is the track's ID; `external` a
        subtitle sent as its own file at `url`, which the client draws;
        `burn` rendered into the video, only on the selected subtitle;
        `none`, only on `off`. The delivery `external` is separate from the
        source `external`, a subtitle file next to the video: a subtitle of
        any source may be delivered `external`.
      enum: [file, stream, external, burn, none]

    TrackTranscode:
      type: object
      description: What a transcoded track becomes.
      properties:
        width: {type: integer}
        height: {type: integer}
        bitrateBps: {type: integer, format: int64}
        channels: {type: integer}
        encoder:
          type: string
          description: Video only; what encodes it, the accelerator's name as `GET /api/v1/accelerators` gives it, such as `Intel Quick Sync (QSV)`, or `CPU`.

    CapabilityMismatch:
      type: object
      description: |
        The capability that failed: its field (such as `maxLevel`, `codec`
        or `containers`), what the client declared, and what the track has.
      required: [field, actual]
      properties:
        field: {type: string}
        declared:
          type: string
          description: The declared value, lists joined by commas; absent when the client declared none.
        actual: {type: string}

    TrackReason:
      type: string
      description: |
        Why a track isn't delivered unchanged in the file: a code clients
        translate. A declared field, one reason each: `containerUnsupported`
        (`containers`), `videoCodecUnsupported` (`codec`),
        `videoCodecTagUnsupported` (`tags`), `videoProfileUnsupported`
        (`profiles`), `videoLevelUnsupported` (`maxLevel`),
        `videoBitDepthUnsupported` (`maxBitDepth`),
        `videoResolutionUnsupported` (`maxWidth`, `maxHeight`),
        `videoFrameRateUnsupported` (`maxFrameRate`),
        `videoBitrateUnsupported` (`maxBitrateBps`), `videoRefFramesUnsupported`
        (`maxRefFrames`), `videoInterlacedUnsupported` (`interlaced`),
        `videoAnamorphicUnsupported` (`anamorphic`), `videoHdrUnsupported`
        (`hdr`, `dolbyVision`), `audioCodecUnsupported` (`codec`),
        `audioChannelsUnsupported` (`maxChannels`),
        `audioSampleRateUnsupported` (`maxSampleRate`),
        `audioBitDepthUnsupported` (`maxBitDepth`), `audioProfileUnsupported`
        (`profiles`), `subtitleCodecUnsupported` (a subtitle's `codec` and
        `delivery`), `trackSelectionUnsupported` (another audio track than
        the file's default, without `trackSelection`) and
        `streamCodecUnsupported` (the codec plays from the file but not in
        the stream). A setting: `directPlayDisabled`,
        `burnSubtitlesEnabled`, `clientQualityLimit`, `remoteQualityLimit`,
        `bandwidthLimit` and `dialogueBoost`. The source:
        `keyframeIndexMissing`, `subtitlePreparing` (an embedded subtitle
        that isn't extracted yet, carried in the stream as plain WebVTT, or
        burned in for an image track), `fallback` (a retry after playback
        failed) and `downloadQuality`. A video that would otherwise play
        directly takes the reason of the subtitle or audio that keeps it
        from the file.
      enum: [containerUnsupported, videoCodecUnsupported, videoCodecTagUnsupported, videoProfileUnsupported,
        videoLevelUnsupported, videoBitDepthUnsupported, videoResolutionUnsupported, videoFrameRateUnsupported,
        videoBitrateUnsupported, videoRefFramesUnsupported, videoInterlacedUnsupported, videoAnamorphicUnsupported,
        videoHdrUnsupported, audioCodecUnsupported, audioChannelsUnsupported, audioSampleRateUnsupported,
        audioBitDepthUnsupported, audioProfileUnsupported, subtitleCodecUnsupported, trackSelectionUnsupported,
        streamCodecUnsupported, directPlayDisabled, burnSubtitlesEnabled, clientQualityLimit, remoteQualityLimit,
        bandwidthLimit, dialogueBoost, keyframeIndexMissing, subtitlePreparing, fallback, downloadQuality]

    RefusalReason:
      type: string
      description: |
        Why a play or download can't happen: `noTracks` the file has
        nothing to play; `fileUnplayable` the work plays only as its file
        here (a book, or a client without a stream) and the file doesn't
        play, `mismatch` says why; `subtitleUnplayable` the chosen subtitle is
        an image file that can be neither drawn nor burned in;
        `keyframeIndexMissing`; `transcodeFailed`; `transcodeLimit` and
        `storageFull` (try again later); `downloadsNotAllowed`; and for a
        download's preparation, `sourceUnreadable` (the file couldn't be
        read, after trying again), `subtitlesUnavailable` (its chosen
        subtitle couldn't be prepared) and `planUnreadable` (the server
        can't read how it was decided).
      enum: [noTracks, fileUnplayable, subtitleUnplayable, keyframeIndexMissing, transcodeFailed, transcodeLimit,
        storageFull, downloadsNotAllowed, sourceUnreadable, subtitlesUnavailable, planUnreadable]

    DialogueBoost:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Whether the play boosts its dialogue.
        cost:
          $ref: "#/components/schemas/DialogueBoostCost"
          description: What the boost changes besides the dialogue, the same whether it's on or off. Absent when nothing.

    DialogueBoostCost:
      type: string
      description: |
        What a dialogue boost changes about a play besides the dialogue:
        `audioAsAac` audio played in its own format, directly or passed
        through to a receiver, is encoded to AAC; `videoTranscode` the video,
        which can't be copied into a stream, is encoded too. Clients show
        it beside the switch, in words from the shared display tables.
      enum: [audioAsAac, videoTranscode]

    PlayPart:
      type: object
      required: [durationMs]
      properties:
        durationMs: {type: integer}
        url:
          type: string
          description: For `file` delivery, the original.

    DownloadCreate:
      type: object
      required: [workId, capabilities]
      properties:
        workId: {$ref: "#/components/schemas/ID"}
        versionId:
          $ref: "#/components/schemas/ID"
          description: Download this version. Default as for playback (`PlayCreate`).
        audioTrackId:
          $ref: "#/components/schemas/ID"
          description: An audio track's `id`. Default as for playback (`PlayCreate`).
        subtitleTrackId:
          type: string
          maxLength: 36
          description: A subtitle track's `id`, or `off`. Default as for playback (`PlayCreate`).
        capabilities:
          $ref: "#/components/schemas/Capabilities"
          description: What the client plays offline.
        settings:
          $ref: "#/components/schemas/PlaybackSettings"
          description: The settings a download applies, `directPlay` and `burnSubtitles`.
        quality:
          $ref: "#/components/schemas/DownloadQuality"
          description: |
            A video's quality, default `high`. The original goes as it is
            wherever the app plays it and it's no larger than the quality's
            estimate. A book is always its original.

    DownloadQuality:
      type: string
      description: |
        A download's quality. `original` is the file as it is, converted
        only where the app can't play it. `high`, for any screen, is
        1080p with the video capped at 8 Mbps (about 3.6 GB an hour at
        the cap, 1.1 GB on average), keeping 5.1 audio. `standard`, for a
        phone, is 1080p capped at 3 Mbps (about 1.4 GB an hour at the cap,
        0.65 GB on average), with stereo AAC at 128 kbps. A conversion
        aims at the quality's picture, so easy titles come out smaller,
        and a grainy title can come out over the cap.
      enum: [original, high, standard]

    Download:
      type: object
      description: |
        A download as the server holds it for its session. Media URLs are
        relative to the API root (`/api/v1/`) and need the user's
        authorization.
      required: [id, workId, versionId, quality, state, delivery, tracks, durationMs, sizeBytes, sizeExact, parts, chapters]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        workId: {$ref: "#/components/schemas/ID"}
        versionId: {$ref: "#/components/schemas/ID"}
        quality:
          $ref: "#/components/schemas/DownloadQuality"
          description: The quality asked for, `original` for a book.
        state: {$ref: "#/components/schemas/DownloadState"}
        queuePosition:
          type: integer
          description: While queued, its place in line, 1 when it's next.
        progress:
          type: number
          description: While preparing, how much is converted, from 0 to 1.
        remainingMs:
          type: integer
          description: While converting, about how long it has left, once that can be told.
        reason:
          $ref: "#/components/schemas/RefusalReason"
          description: |
            When failed, why: `transcodeFailed`, `storageFull`,
            `sourceUnreadable`, `subtitlesUnavailable` or `planUnreadable`.
        delivery: {$ref: "#/components/schemas/DownloadDelivery"}
        tracks:
          type: array
          description: |
            Every track of the version, and the subtitle choice `off`, as a
            play gives them (`PlayStarted.tracks`), for playing the download
            offline. A track inside the downloaded file has delivery `file`
            and its stream index in that file: in a conversion the video, the
            audio, then each text track it carries, the chosen one first. A
            subtitle delivered `external` is fetched with the download, at
            `url`, once the download is ready; one that couldn't be
            extracted has no delivery. A choice without a delivery isn't in
            the download.
          items: {$ref: "#/components/schemas/PlayTrack"}
        durationMs: {type: integer}
        sizeBytes:
          type: integer
          format: int64
          description: |
            Every part's bytes. Exact when `sizeExact`; until a conversion
            is ready, an estimate from the quality's cap, which a grainy
            title can exceed.
        sizeExact:
          type: boolean
          description: |
            `sizeBytes` is exact: the download is ready, or the original
            goes as it is. Otherwise it's an estimate.
        parts:
          type: array
          description: The version's parts in order; positions are on their joined timeline.
          items: {$ref: "#/components/schemas/DownloadPart"}
        chapters:
          type: array
          items: {$ref: "#/components/schemas/Chapter"}
        markers:
          type: array
          description: The version's markers on its timeline, in order.
          items: {$ref: "#/components/schemas/Marker"}
        expiresAt:
          type: string
          format: date-time
          description: Once ready or failed, when the server forgets it, unless deleted sooner.

    DownloadState:
      type: string
      description: |
        Where a download is: `queued` waiting in line on the server
        (`queuePosition` says where); `preparing` its subtitles or conversion
        being made (`progress` and `remainingMs` say how far); `ready` to
        fetch each part's `url`, and each subtitle's; `failed` (`reason` says
        why, and `retry` asks again).
      enum: [queued, preparing, ready, failed]

    DownloadDelivery:
      type: string
      description: |
        What a download fetches: the original `file`, or a `conversion`, an
        MP4 per part made for the download.
      enum: [file, conversion]

    DownloadList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Download"}

    DownloadPart:
      type: object
      required: [durationMs, url, contentType]
      properties:
        durationMs: {type: integer}
        url:
          type: string
          description: The part's file, fetched with the user's authorization and range requests.
        contentType:
          type: string
          description: The file's type, as it's served (`video/mp4` for a conversion; for an original, as the version's files are).
        sizeBytes:
          type: integer
          format: int64
          description: The file's exact size, once ready.
        etag:
          type: string
          description: The file's strong ETag, once ready, for `If-Range`.
        sha256:
          type: string
          description: A converted file's SHA-256 in lowercase hex, to check it once fetched.

    DownloadEstimateRequest:
      type: object
      required: [items, capabilities]
      properties:
        items:
          type: array
          maxItems: 1000
          items: {$ref: "#/components/schemas/DownloadEstimateItem"}
        capabilities:
          $ref: "#/components/schemas/Capabilities"
          description: As for a download (`DownloadCreate`).
        settings: {$ref: "#/components/schemas/PlaybackSettings"}

    DownloadEstimateItem:
      type: object
      description: A work to estimate, with the choices its download would be asked with.
      required: [workId]
      properties:
        workId: {$ref: "#/components/schemas/ID"}
        versionId: {$ref: "#/components/schemas/ID"}
        audioTrackId: {$ref: "#/components/schemas/ID"}
        subtitleTrackId:
          type: string
          maxLength: 36
          description: A subtitle track's `id`, or `off`.

    DownloadEstimateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: One per work asked about, in order.
          items: {$ref: "#/components/schemas/DownloadEstimate"}

    DownloadEstimate:
      type: object
      required: [workId, playable, options]
      properties:
        workId: {$ref: "#/components/schemas/ID"}
        versionId:
          $ref: "#/components/schemas/ID"
          description: The version the download would be, when playable.
        playable: {type: boolean}
        reason:
          $ref: "#/components/schemas/RefusalReason"
          description: Why it can't be downloaded, when there's one to give.
        options:
          type: array
          description: Each quality, as the download menu lists them.
          items: {$ref: "#/components/schemas/DownloadOption"}

    DownloadOption:
      type: object
      required: [quality, sizeBytes, asIs, delivery]
      properties:
        quality: {$ref: "#/components/schemas/DownloadQuality"}
        sizeBytes:
          type: integer
          format: int64
          description: Exact when `asIs`, else an estimate from the quality's cap, which a grainy title can exceed.
        asIs:
          type: boolean
          description: The original goes as it is.
        delivery: {$ref: "#/components/schemas/DownloadDelivery"}

    DownloadCheck:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items: {$ref: "#/components/schemas/DownloadRef"}

    DownloadRef:
      type: object
      description: A download an app keeps.
      required: [workId, versionId]
      properties:
        workId: {$ref: "#/components/schemas/ID"}
        versionId: {$ref: "#/components/schemas/ID"}

    DownloadCheckResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: One per download asked about, in order.
          items: {$ref: "#/components/schemas/DownloadAvailability"}

    DownloadAvailability:
      type: object
      required: [workId, versionId, available]
      properties:
        workId: {$ref: "#/components/schemas/ID"}
        versionId: {$ref: "#/components/schemas/ID"}
        available:
          type: boolean
          description: False means the app deletes the download.

    PreviewsDelivery:
      type: object
      required: [ready]
      properties:
        ready: {type: boolean}
        url:
          type: string
          description: The manifest, when ready.

    PreviewManifest:
      type: object
      description: Preview thumbnails as sprite sheets of `columns` by `rows` frames, one frame every `intervalMs`.
      required: [intervalMs, width, height, columns, rows, sheets]
      properties:
        intervalMs: {type: integer}
        width:
          type: integer
          description: One frame's width.
        height: {type: integer}
        columns: {type: integer}
        rows: {type: integer}
        sheets:
          type: array
          description: Sheet URLs relative to the manifest, in order.
          items: {type: string}

    PlayUpdate:
      type: object
      required: [positionMs, state]
      properties:
        positionMs: {type: integer}
        state: {$ref: "#/components/schemas/PlayState"}
        seekToFirstFrameMs:
          type: integer
          description: After a seek, the time until the first frame showed.
        bandwidthBps:
          type: integer
          format: int64
          description: The client's measured download rate.
        subtitleTrackId:
          type: string
          maxLength: 36
          description: |
            A subtitle track's `id`, or `off`: the one the client shows
            after switching without a new play (a choice with a `delivery`
            in `PlayStarted.tracks`). Absent while it shows the play's own.
            A switch is remembered for an episode's series, as a choice in
            `startPlay` is.
        audioTrackId:
          $ref: "#/components/schemas/ID"
          description: |
            The audio track the client plays after switching inside the file
            (a choice with delivery `file`). Absent while it plays the
            play's own. Remembered for an episode's series, as a subtitle
            switch is.

    PlayState:
      type: string
      description: What a client's player is doing.
      enum: [playing, paused, buffering, ended]

    PlayStop:
      type: object
      properties:
        positionMs: {type: integer}
        message:
          type: string
          maxLength: 500
          description: An admin's words to the viewer of someone else's play.
        code:
          $ref: "#/components/schemas/PlayerErrorCode"
          description: What failed, when the owner stops the play because playback failed. It needs `positionMs`.
        detail:
          type: string
          maxLength: 1000
          description: The player's own error text, for the server log. It goes with a `code`.

    PlayEvent:
      type: object
      description: One play of a work, from start to stop.
      required: [id, work, userId, username, startedAt, endedAt, positionMs, completed]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        work: {$ref: "#/components/schemas/WorkSummary"}
        userId: {$ref: "#/components/schemas/ID"}
        username: {type: string}
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time}
        positionMs:
          type: integer
          description: Where playback stopped.
        completed:
          type: boolean
          description: Whether it reached the played threshold.

    PlayEventFeed:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/PlayEvent"}
        next: {type: string}
        total: {type: integer}

    PlayFallback:
      type: object
      required: [positionMs, code]
      properties:
        positionMs: {type: integer}
        code:
          $ref: "#/components/schemas/PlayerErrorCode"
          description: What failed.
        detail:
          type: string
          maxLength: 1000
          description: The player's own error text, for the server log.

    PlayerErrorCode:
      type: string
      description: What failed in a client's player.
      enum: [mediaDecodeError, mediaSourceError, networkError, unsupported]

    Play:
      type: object
      description: A play with its diagnostics, for Now playing.
      required: [id, workId, title, userId, username, startedAt, state, local, positionMs, delivery, tracks]

      properties:
        id: {$ref: "#/components/schemas/ID"}
        workId: {$ref: "#/components/schemas/ID"}
        title: {type: string}
        work:
          $ref: "#/components/schemas/WorkSummary"
          description: The work's summary, with its artwork; absent for a work the admin may not see.
        versionId: {$ref: "#/components/schemas/ID"}
        userId: {$ref: "#/components/schemas/ID"}
        username: {type: string}
        clientName:
          type: string
          description: The name of the session or API key it was started by, such as "Living Room".
        address:
          type: string
          description: The client's IP address, through trusted proxies.
        startedAt: {type: string, format: date-time}
        state:
          $ref: "#/components/schemas/PlayState"
          description: What the player is doing, as the last heartbeat reported it.
        local: {type: boolean}
        positionMs:
          type: integer
          description: Where playback is, as the last heartbeat reported it.
        durationMs:
          type: integer
          description: The version's duration, every part's.
        bitrateBps:
          type: integer
          format: int64
          description: The stream's bitrate, a video transcode's target or else the source's, when known.
        bandwidthBps:
          type: integer
          format: int64
          description: The client's measured download rate, as its last heartbeat reported it.
        device:
          $ref: "#/components/schemas/ClientDevice"
          description: The app and device that started it, as its requests identify them.
        delivery: {$ref: "#/components/schemas/PlayDelivery"}
        videoProcessing:
          $ref: "#/components/schemas/ProcessedOn"
          description: Where the video is transcoded, `accelerator` when an accelerator encodes it; absent when the video isn't transcoded.
        tracks:
          type: array
          description: Every track of the version and the subtitle choice `off`, as `PlayStarted.tracks` gives them.
          items: {$ref: "#/components/schemas/PlayTrack"}
        sourceTracks:
          type: array
          description: The selected source tracks, titled as a version's tracks are.
          items: {$ref: "#/components/schemas/Track"}
        transcode: {$ref: "#/components/schemas/TranscodeInfo"}
        seekToFirstFrameMs:
          type: array
          description: After each of the play's recent seeks, the time to the first frame the client reported, oldest first.
          items: {type: integer}

    TranscodeInfo:
      type: object
      description: An HLS play's ffmpeg job, for display only.
      properties:
        state:
          $ref: "#/components/schemas/TranscodeState"
          description: Absent when no job is running.
        encodedMs:
          type: integer
          description: Where the job's segments reach on the version's timeline.
        speed:
          type: number
          format: double
          description: Seconds of media the job makes a second while it works, pauses left out; 1.8 is 1.8× realtime. Absent until its first segment.
        command:
          type: string
          description: The ffmpeg command line, to reproduce it by hand.
        exitCode: {type: integer}
        stderr:
          type: string
          description: The tail of ffmpeg's error output.

    TranscodeState:
      type: string
      description: |
        Where a play's transcode is: `paused` far enough ahead of the player.
      enum: [running, paused, done, failed]

    ActivityFeed:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ActivityEvent"}
        next: {type: string}

    ActivityGroup:
      type: string
      description: |
        The Activity page's Show filter: `plays` (`playStarted`,
        `playFinished`), `added`, `signIns` (`signedIn`, `signInFailed`,
        `userJoined`) and `server` (`taskEnded`, `problemRaised`).
      enum: [plays, added, signIns, server]

    ActivityKind:
      type: string
      description: What an event tells of. Skip kinds you don't know.
      enum: [playStarted, playFinished, added, signedIn, signInFailed, userJoined, taskEnded, problemRaised]

    ActivityEvent:
      type: object
      description: One event of the Activity page, its kind's fields under its group.
      required: [id, occurredAt, kind]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        occurredAt: {type: string, format: date-time}
        kind: {$ref: "#/components/schemas/ActivityKind"}
        play: {$ref: "#/components/schemas/ActivityPlay"}
        added: {$ref: "#/components/schemas/ActivityAdded"}
        signIn: {$ref: "#/components/schemas/ActivitySignIn"}
        joined: {$ref: "#/components/schemas/ActivityJoined"}
        task: {$ref: "#/components/schemas/ActivityTask"}
        problem: {$ref: "#/components/schemas/ActivityProblem"}

    ActivityWork:
      type: object
      description: A work as an event names it; an episode by its series, with its season and number.
      required: [workId, kind, title]
      properties:
        workId: {$ref: "#/components/schemas/ID"}
        kind: {$ref: "#/components/schemas/WorkKind"}
        title: {type: string}
        seasonNumber: {type: integer}
        episodeNumber: {type: integer}

    ActivityPlay:
      type: object
      description: "`playStarted` and `playFinished`: a play started, or ended past the played threshold."
      required: [userId, username, work, local]
      properties:
        userId: {$ref: "#/components/schemas/ID"}
        username: {type: string}
        work: {$ref: "#/components/schemas/ActivityWork"}
        clientName:
          type: string
          description: The name of the session or API key it was played on.
        local: {type: boolean}

    ActivityAdded:
      type: object
      description: |
        `added`: a folder's new files, after a scan, under the root work
        of the first: a series' episodes, a movie, a book or videos.
      required: [libraryName, work, count]
      properties:
        libraryName:
          type: string
          description: The library's name.
        work: {$ref: "#/components/schemas/ActivityWork"}
        count:
          type: integer
          description: Files added, extras aside.

    ActivitySignIn:
      type: object
      description: |
        `signedIn` and `signInFailed`. A failed sign-in for a username
        nobody has names no user.
      required: [address, local]
      properties:
        userId: {$ref: "#/components/schemas/ID"}
        username: {type: string}
        clientName:
          type: string
          description: The new session's name.
        address:
          type: string
          description: The client's address.
        local: {type: boolean}
        count:
          type: integer
          description: "`signInFailed`: the failed sign-ins it tells of."

    ActivityJoined:
      type: object
      description: "`userJoined`: a user created from an invite, or by an admin."
      required: [userId, username]
      properties:
        userId: {$ref: "#/components/schemas/ID"}
        username: {type: string}
        addedBy:
          type: string
          description: The admin who added the user; absent for an invite.

    ActivityTask:
      type: object
      description: "`taskEnded`: a night run's end, or Run now's, that did something or failed."
      required: [task, failedCount]
      properties:
        task: {$ref: "#/components/schemas/TaskName"}
        summary: {type: string}
        error:
          type: string
          description: Why the run failed.
        failedCount:
          type: integer
          description: The task's items that failed for good, as it ended.

    ActivityProblem:
      type: object
      description: "`problemRaised`: a problem as it was raised."
      required: [id, code, message, severity]
      properties:
        id:
          type: string
          description: The problem's ID, as `GET /api/v1/problems` names it.
        code: {type: string}
        message: {type: string}
        severity: {$ref: "#/components/schemas/ProblemSeverity"}

    PlayList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Play"}

    PlaySummary:
      type: object
      description: One of the user's plays, for the stream limit.
      required: [id, workId, title, startedAt]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        workId: {$ref: "#/components/schemas/ID"}
        title: {type: string}
        clientName:
          type: string
          description: The name of the session or API key it was started by.
        startedAt: {type: string, format: date-time}

    EventStreamMessage:
      description: One frame on the live-events WebSocket.
      oneOf:
        - {$ref: "#/components/schemas/SnapshotMessage"}
        - {$ref: "#/components/schemas/EventMessage"}
        - {$ref: "#/components/schemas/ResyncMessage"}
        - {$ref: "#/components/schemas/KeepAliveMessage"}
      discriminator:
        propertyName: type
        mapping:
          snapshot: "#/components/schemas/SnapshotMessage"
          event: "#/components/schemas/EventMessage"
          resync: "#/components/schemas/ResyncMessage"
          keepAlive: "#/components/schemas/KeepAliveMessage"

    SnapshotMessage:
      type: object
      description: Sent first on every connection and after `resync`. A changed `serverVersion` means the client should offer a reload.
      required: [type, serverVersion]
      properties:
        type:
          type: string
          enum: [snapshot]
        serverVersion: {type: string}
        problemCount:
          type: integer
          description: Admins only. Open problems, for the dot on Admin.

    EventMessage:
      type: object
      description: |
        A hint that something changed. It carries IDs and counts only;
        clients refetch through the API. Each kind maps to one cache
        operation. Hints of many changes come at most about once a second.
        Documented kinds and their fields:

        - `workChanged` (`workId`): one work's detail changed, such as after
          Fix match or a metadata refresh.
        - `libraryChanged` (`libraryIds`): root works were added to or removed
          from these libraries (found by a scan, matched, unmatched, moved,
          gone or purged), one was created or edited, or one is
          being deleted. It names only
          libraries the profile sees and comes at most about once every
          3 seconds. Refetch Home, the library list and its counts, and any
          open grid, list, filter or letter rail of those libraries, keeping
          the viewer's place in a grid.
        - `userStateChanged` (`workIds`): the user's state for these works
          changed, possibly on another client: marked played or unplayed
          (a series or season with its episodes), a favorite, or a play's
          last position. Refetch them, and the lists that show them.
        - `playEnded` (`playId`, `message`): the user's play was stopped
          by an admin or another client, or expired; `message` is the
          admin's words to the viewer, if any.
        - `downloadsChanged`: the user's downloads on the server moved:
          in line, in their preparation (at most every 10 seconds), or to
          ready or failed. Refetch the downloads that aren't ready.
        - `tasksChanged`: admins only. A task's work moved: an item started
          or finished, or reported its progress, a run began or ended, or
          something was asked for. Refetch the tasks and libraries, whose
          `scan` says how a scan is going, and the missing files.
        - `playsChanged`: admins only. A play started or ended, or a
          heartbeat reported its position; refetch the plays and the play
          events.
        - `problemsChanged` (`problemCount`): admins only. The open problems
          changed; refetch them.
        - `logsChanged`: admins only. The server logged lines at Info or
          above; refetch the recent log.
        - `activityChanged`: admins only. An event was recorded; refetch
          the activity.
      required: [type, kind]
      properties:
        type:
          type: string
          enum: [event]
        kind: {$ref: "#/components/schemas/EventKind"}
        workId: {$ref: "#/components/schemas/ID"}
        libraryIds:
          type: array
          items: {$ref: "#/components/schemas/ID"}
        playId: {$ref: "#/components/schemas/ID"}
        message: {type: string}
        problemCount: {type: integer}
        workIds:
          type: array
          items: {$ref: "#/components/schemas/ID"}

    EventKind:
      type: string
      description: What an event says changed. Skip kinds you don't know.
      enum: [workChanged, libraryChanged, userStateChanged, playEnded, downloadsChanged,
        tasksChanged, playsChanged, problemsChanged, logsChanged, activityChanged]

    ResyncMessage:
      type: object
      description: The client fell behind and events were dropped. Treat every live-kept query as stale and refetch; a fresh `snapshot` follows.
      required: [type]
      properties:
        type:
          type: string
          enum: [resync]

    KeepAliveMessage:
      type: object
      description: Sent every 25 seconds, so a client can tell a quiet socket from a dead one. It changes nothing.
      required: [type]
      properties:
        type:
          type: string
          enum: [keepAlive]
